name: seq-demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GetMatchHistoryBySequenceNum demo
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          cat > demo.py <<'PY'
          #!/usr/bin/env python3
          """Демо Steam GetMatchHistoryBySequenceNum: листаем глобальную ленту всех матчей и ищем в ней борова.
          
          Запуск: STEAM_API_KEY=... python3 seq_demo.py [start_seq] [pages]
          По умолчанию стартуем на 50 матчей раньше его победы на Weaver (match 9068819059, seq 7615626621).
          """
          import json
          import os
          import sys
          import time
          import urllib.request
          from datetime import datetime, timezone
          
          ACCOUNT = 226241953
          KEY = os.environ["STEAM_API_KEY"]
          start = int(sys.argv[1]) if len(sys.argv) > 1 else 7615626621 - 50
          pages = int(sys.argv[2]) if len(sys.argv) > 2 else 3
          
          
          def ts(t):
              return datetime.fromtimestamp(t, timezone.utc).strftime("%m-%d %H:%M:%S")
          
          
          seq, total, t0 = start, 0, time.time()
          for page in range(pages):
              url = ("https://api.steampowered.com/IDOTA2Match_570/GetMatchHistoryBySequenceNum/v1/"
                     f"?key={KEY}&start_at_match_seq_num={seq}&matches_requested=100")
              t = time.time()
              with urllib.request.urlopen(url, timeout=60) as r:
                  body = r.read()
              res = json.loads(body)["result"]
              ms = res.get("matches") or []
              total += len(ms)
              print(f"page {page + 1}: status {res.get('status')}, {len(ms)} matches, {len(body) // 1024} KB, {time.time() - t:.1f}s, "
                    f"seq {ms[0]['match_seq_num']}..{ms[-1]['match_seq_num']}, "
                    f"ended {ts(ms[0]['start_time'] + ms[0]['duration'])}..{ts(ms[-1]['start_time'] + ms[-1]['duration'])} UTC")
              if page == 0:
                  p = ms[0]["players"][0]
                  print(f"  пример игрока в матче: {json.dumps({k: p[k] for k in list(p)[:8]}, ensure_ascii=False)} ...")
              for m in ms:
                  me = next((p for p in m["players"] if p.get("account_id") == ACCOUNT), None)
                  if me:
                      win = m["radiant_win"] == (me["player_slot"] < 128)
                      print(f"  >>> БОРОВ: match {m['match_id']} (seq {m['match_seq_num']}), hero {me['hero_id']}, "
                            f"{'W' if win else 'L'}, {me['kills']}/{me['deaths']}/{me['assists']}, lobby {m['lobby_type']}")
              seq = ms[-1]["match_seq_num"] + 1
              time.sleep(1)
          
          print(f"итого {total} матчей за {time.time() - t0:.0f}s")
          PY
          python3 demo.py
