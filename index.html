.top .wrap { position: relative; }

// Язык: ?lang=es в ссылке, потом выбор из прошлого визита, по умолчанию русский.
const savedLang = () => { try { return localStorage.getItem("lang"); } catch { return null; } };
let lang = [new URLSearchParams(location.search).get("lang"), savedLang()].find(l => l in I18N) || "ru";
let S = I18N[lang];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n == null ? "—" : n.toLocaleString(S.locale);
const sign = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
// дельта средних: зелёный ▲ — выросло, красный ▼ — упало
const trend = (n, txt) => `<span class="dl ${n > 0 ? "w" : n < 0 ? "l" : "m"}">${n ? `<span class="tri">${n > 0 ? "▲" : "▼"}</span>` : ""}${txt}</span>`;
const dur = s => s == null ? "—" : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const pct = o => o.n ? Math.round(o.w / o.n * 100) : null;
const dShort = iso => new Date(iso + "T00:00:00").toLocaleDateString(S.locale, { day: "2-digit", month: "2-digit" });
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return S.justNow;
  if (m < 60) return S.minAgo(m);
  const h = Math.floor(m / 60);
  if (h < 24) return S.hAgo(h, m % 60);
  return S.dAgo(Math.floor(h / 24));
};
const when = iso => new Date(iso).toLocaleString(S.locale, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const games = n => S.games(n);

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const next = await r.json();
    const changed = !DATA || next.updated_at !== DATA.updated_at;
    DATA = next;
    if (changed) render(DATA);
  } catch (e) {
    if (!DATA) $("#app").innerHTML = `<div class="err">${S.loadErr(esc(e.message))}</div>`;
    setTimeout(load, 60000);
  }
}

// Сборщик стартует по крону каждые 15 минут (:00/:15/:30/:45 UTC), GitHub иногда запаздывает на несколько минут.
const SLOT = 15 * 60000;
const nextRun = () => Math.ceil((new Date(DATA.updated_at).getTime() + 1) / SLOT) * SLOT;
let lastPoll = 0;

function tickLive() {
  if (!DATA) return;
  const left = nextRun() - Date.now();
  const due = left <= 0;
  const txt = due ? S.waiting : `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
  const sourceFailed = DATA.scrape_status === "unavailable";
  const sourceCached = DATA.scrape_status === "cached";
  const sourceStale = !DATA.scraped_at || Date.now() - new Date(DATA.scraped_at) > 45 * 60000;
  $("#schedule").textContent = due ? S.runNow : S.untilRun;
  $("#timer").textContent = txt;
  $("#live").classList.toggle("due", due);
  $("#live").classList.toggle("stale", sourceFailed || sourceStale || Date.now() - new Date(DATA.updated_at) > 45 * 60000);
  $("#upd").textContent = `${S.recalc}: ${ago(DATA.updated_at)}`;
  $("#source").textContent = `${S.dbData}: ${DATA.scraped_at ? ago(DATA.scraped_at) : S.notYet}${sourceFailed ? ` · ${S.srcDown}` : sourceCached ? ` · ${S.srcCached}` : ""}`;
  const foot = $("#foot");
  if (foot) foot.innerHTML = `${S.recalc}: <b>${when(DATA.updated_at)}</b> · ${S.dbDataLc}: <b>${DATA.scraped_at ? when(DATA.scraped_at) : "—"}</b>${sourceFailed ? ` · ${S.footDown}` : ""} · ${S.nextRunLc}: <b>${txt}</b>`;
  // как только слот прошёл — раз в минуту проверяем, не появились ли новые данные
  if (due && Date.now() - lastPoll > 60000) { lastPoll = Date.now(); load(); }
}

  const formWr = d.form?.n ? d.form.w / d.form.n : null;
  const perGame = formWr == null ? 0 : d.step * (2 * formWr - 1);
  const goalGames = perGame > 0 ? Math.ceil((GOAL - d.mmr) / perGame) : null;

        <div class="delta"><div class="v ${d.mmr - d.days.start >= 0 ? "w" : "l"}">${sign(d.mmr - d.days.start)}</div><div class="s">${S.since(dShort(d.history_from), fmt(d.days.start))}</div></div>
      </div>
      <div class="sep"></div>
      <div class="ch"><span class="lbl">${S.farm7}</span><span class="sub">${S.farmSub(games(st.farm.week.n))}</span></div>

async function loadHistList() {
  histList = "loading";
  try {
    const r = await fetch("history.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    histList = await r.json();
  } catch {
    histList = "error";
  }
  drawHistList();
}

function farmTiles(f) {
  const T = [["gpm", 0], ["xpm", 0], ["lhm", 1], ["nw", 0, v => (v / 1000).toFixed(1) + "k"], ["kda", 1], ["hdm", 0]];
  return T.map(([key, digits, show], i) => {
    const name = S.farmNames[i];
    const v = f.week[key], pv = f.prev[key], all = f.all[key];
    const view = x => x == null ? "—" : show ? show(x) : x.toFixed(digits);
    const dlt = v != null && pv != null ? v - pv : null;
    const dTxt = dlt == null ? "" : trend(dlt, show ? show(Math.abs(dlt)) : Math.abs(dlt).toFixed(digits));
    return `<div class="tile"><span class="k">${name}</span><span class="v">${view(v)}${dTxt}</span><span class="s">${S.perPeriod} ${view(all)}</span></div>`;
  }).join("");
}

function streakTile(name, s, cls) {
  if (!s) return `<div class="tile"><span class="k">${name}</span><span class="v">—</span></div>`;
  const a = dShort(s.from.slice(0, 10)), b = dShort(s.to.slice(0, 10));
  return `<div class="tile"><span class="k">${name}</span><span class="v ${cls}">${s.n}</span><span class="s">${a === b ? a : `${a}–${b}`}</span></div>`;
}

function runs(ms, win) {
  let best = 0, cur = 0;
  for (const m of ms) { cur = m.win === win ? cur + 1 : 0; best = Math.max(best, cur); }
  return best;
}

function avgOf(ms, f, digits = 0, raw = false) {
  const v = ms.map(f).filter(x => x != null && !Number.isNaN(x));
  if (!v.length) return "—";
  const a = v.reduce((s, x) => s + x, 0) / v.length;
  return raw ? a : a.toFixed(digits);
}

// Оценка шансов: логиты складываются. База — винрейт пика (сжатый к общему), за каждого героя добавляется
// его поправка в играх на этом пике; её априорное значение — поправка того же героя по всем играм.
function draftOdds(dr) {
  const logit = p => Math.log(p / (1 - p)), sig = x => 1 / (1 + Math.exp(-x));
  const all = dr.games, p0 = (all.reduce((a, g) => a + g[1], 0) + 1) / (all.length + 2);
  const mine = calc.pick == null ? all : all.filter(g => g[0] === calc.pick);
  const pb = (mine.reduce((a, g) => a + g[1], 0) + CALC_K * p0) / (mine.length + CALC_K);
  const tally = (gs, h, i) => gs.reduce((o, g) => g[i]?.includes(h) ? { n: o.n + 1, w: o.w + g[1] } : o, { n: 0, w: 0 });
  const factors = [];
  for (const [side, i] of [["allies", 2], ["enemies", 3]]) {
    for (const h of calc[side]) {
      const glob = tally(all, h, i);
      const prior = sig(logit(pb) + logit((glob.w + CALC_K * p0) / (glob.n + CALC_K)) - logit(p0));
      const own = tally(mine, h, i);
      const d = logit((own.w + CALC_K * prior) / (own.n + CALC_K)) - logit(pb);
      factors.push({ h, side, d, pp: sig(logit(pb) + d) - pb, n: own.n, w: own.w });
    }
  }
  const has = (g, i, hs) => hs.every(h => g[i]?.includes(h));
  const exact = factors.length ? mine.filter(g => has(g, 2, calc.allies) && has(g, 3, calc.enemies)) : [];
  return {
    p: sig(logit(pb) + factors.reduce((a, f) => a + f.d, 0)), pb, n: mine.length, w: mine.reduce((a, g) => a + g[1], 0),
    factors: factors.sort((a, b) => Math.abs(b.d) - Math.abs(a.d)), exact: { n: exact.length, w: exact.reduce((a, g) => a + g[1], 0) },
  };
}

function renderCalc(st) {
  const el = $("#calcCard"), dr = st.draft;
  const head = `<div class="ch"><h2>${S.calc}</h2><span class="sub">${dr?.games?.length ? S.calcSub(dr.games.length) : ""}</span></div>`;
  if (!dr?.games?.length || (st.lineups || 0) < st.games * .9) { el.innerHTML = `${head}<p class="sub">${S.vsWait(st.lineups || 0)}</p>`; return; }
  // по умолчанию пик — самый частый герой, то есть Спектра
  if (calc.pick === null) {
    const cnt = {};
    for (const g of dr.games) cnt[g[0]] = (cnt[g[0]] || 0) + 1;
    calc.pick = +Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  }
  el.innerHTML = `

      const free = ["pick", "allies", "enemies"].find(g => g === "pick" ? calc.pick == null : calc[g].length < CALC_MAX[g]);
      if (calc.side === "pick" || calc[calc.side].length >= CALC_MAX[calc.side]) calc.side = free || calc.side;
    } else return;
    if (b.dataset.reset != null) $("#cQ").value = "";

  });

}

function niceRange(vals, pad) {
  return [Math.floor((Math.min(...vals) - pad) / 50) * 50, Math.ceil((Math.max(...vals) + pad) / 50) * 50];
}

// монотонная кубическая кривая (Fritsch–Carlson): плавно, но без выбросов выше/ниже точек
function smoothPath(ps) {
  const n = ps.length;
  if (n < 3) return ps.map(([px, py], i) => `${i ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`).join("");
  const dx = [], sl = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = ps[i + 1][0] - ps[i][0]; sl[i] = (ps[i + 1][1] - ps[i][1]) / dx[i]; }
  const m = [sl[0]];
  for (let i = 1; i < n - 1; i++) m[i] = sl[i - 1] * sl[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / sl[i - 1] + (dx[i] + 2 * dx[i - 1]) / sl[i]);
  m[n - 1] = sl[n - 2];
  let path = `M${ps[0][0].toFixed(1)},${ps[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3, [x0, y0] = ps[i], [x1, y1] = ps[i + 1];
    path += `C${(x0 + h).toFixed(1)},${(y0 + m[i] * h).toFixed(1)} ${(x1 - h).toFixed(1)},${(y1 - m[i + 1] * h).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return path;
}

function drawDays(d) {
  const el = $("#dayChart");
  // высота под карточку: убираем старый svg, меряем свободное место и подгоняем viewBox под него
  el.innerHTML = "";
  const box = el.parentElement;
  const W = 1100, L = 50, R = 16, T = 26, B = 30;
  const H = box.clientWidth && box.clientHeight > 200 ? Math.max(330, Math.floor(W * (box.clientHeight - 2) / box.clientWidth)) : 330;
  const DAY = 86400000;
  // точка старта — рейтинг до первой игры после патча, дневные точки — рейтинг на конец дня
  const t0 = new Date(d.history_from + "T00:00:00").getTime() - DAY;
  const startIso = new Date(t0 + 12 * 3600000).toISOString().slice(0, 10);
  const pts = [{ date: startIso, mmr: d.days.start, start: true }, ...d.days.points];
  const tEnd = new Date(pts[pts.length - 1].date + "T00:00:00").getTime();
  const [lo, hi] = niceRange(pts.map(p => p.mmr), 40);
  const x = date => L + (new Date(date + "T00:00:00").getTime() - t0) / Math.max(DAY, tEnd - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = (hi - lo) / 50 > 8 ? 100 : 50;
  let g = "";
  for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let t = t0; t <= tEnd; t += 7 * DAY) {
    const dd = new Date(t), iso = new Date(t + 12 * 3600000).toISOString().slice(0, 10);
    g += `<text x="${x(iso)}" y="${H - 8}" text-anchor="middle">${String(dd.getDate()).padStart(2, "0")}.${String(dd.getMonth() + 1).padStart(2, "0")}</text>`;
  }
  const line = smoothPath(pts.map(p => [x(p.date), y(p.mmr)]));
  const area = line + `L${x(pts[pts.length - 1].date)},${H - B}L${x(pts[0].date)},${H - B}Z`;
  const last = pts[pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${S.daily}">
    <defs><linearGradient id="gArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3ae45" stop-opacity=".22"/><stop offset="1" stop-color="#e3ae45" stop-opacity="0"/></linearGradient></defs>
    ${g}
    <text x="${L + 4}" y="${T + 4}">${S.patch}</text>
    <path class="area" d="${area}"/>
    <path class="lineGold" d="${line}"/>
    ${pts.map((p, i) => {
      const t = p.start ? `<b>${p.mmr}</b><br>${S.beforePatch}` : `<b>${p.mmr}</b><br>${dShort(p.date)} · <span class="w">${p.w}W</span>–<span class="l">${p.l}L</span> · ${sign(p.mmr - pts[i - 1].mmr)}`;
      return `${p === last ? `<circle class="pt" cx="${x(p.date)}" cy="${y(p.mmr)}" r="5"/>` : ""}<circle class="hit" cx="${x(p.date)}" cy="${y(p.mmr)}" r="12" data-tip="${esc(t)}"/>`;
    }).join("")}
    <text class="lbl-v" x="${x(last.date) - 10}" y="${y(last.mmr) - 12}" text-anchor="end">≈${last.mmr}</text>
  </svg>`;
}

function drawMatches(d) {

    return `<rect x="${cx(i) - Math.min(11, cw / 3)}" y="${Math.min(y0, y1)}" width="${Math.min(22, cw / 1.5)}" height="${Math.max(2, Math.abs(y1 - y0))}" rx="2" fill="${col}" opacity=".75"/>

      <rect class="hit" x="${cx(i) - cw / 2}" y="${T}" width="${cw}" height="${H - T}" data-tip="${esc(t)}"/>`;

  const last = ms[n - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${S.matchAria}">

  </svg>`;
}

// Казино в шапке. Радик на барабане вдвое чаще остальных: джекпот примерно 1 к 125.
const ITEM = k => `https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/${k}.png`;
const DOWN = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 48"><rect width="66" height="48" fill="#2a1415"/><path d="M19 13h28L33 37z" fill="#d65c58"/></svg>');
const SYMBOLS = [
  { id: "radiance", img: ITEM("radiance"), w: 2 },
  { id: "spectre", img: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/spectre.png", w: 1 },
  { id: "down", img: DOWN, w: 1 },
  { id: "manta", img: ITEM("manta"), w: 1 },

  { id: "bkb", img: ITEM("black_king_bar"), w: 1 },
  { id: "wand", img: ITEM("magic_wand"), w: 1 },
];
SYMBOLS.forEach(x => { new Image().src = x.img; });
const SLOT_TOTAL = SYMBOLS.reduce((a, x) => a + x.w, 0);
function rollSymbol() {
  let r = Math.random() * SLOT_TOTAL;
  return SYMBOLS.findIndex(x => (r -= x.w) < 0);
}
const slot = { reels: [7, 0, 4], spinning: false, result: "idle", spins: 0, jackpots: 0 };
try { Object.assign(slot, JSON.parse(localStorage.getItem("slot") || "{}"), { spinning: false, result: "idle" }); } catch {}
function showSlot() {
  $("#slotName").textContent = S.slotName;
  $("#slotCnt").textContent = S.slotCnt(slot.spins, slot.jackpots);
  $("#lever").setAttribute("aria-label", S.slotPull);
  const res = $("#slotRes");

  box.classList.toggle("jack", slot.result === "jackpot");

const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
// Одноразовая анимация: снимаем класс, перезапускаем reflow, ставим снова.
function replay(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}
function flash(red) {
  if (calm()) return;
  const r = $("#slot").getBoundingClientRect(), f = document.createElement("div");
  f.className = "flash" + (red ? " red" : "");
  f.style.setProperty("--x", r.left + r.width / 2 + "px");
  f.style.setProperty("--y", r.top + r.height / 2 + "px");
  document.body.append(f);
  setTimeout(() => f.remove(), 900);
}
// Салют из Радиков и золотых искр из центра автомата.
function fireworks() {
  if (calm()) return;
  flash(false);
  const r = $("#slot").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#e3ae45", "#fff3c4", "#ff8a3d", "#ffd76a", "#d65c58", "#5cbf75", "#4fb8cf"];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement("span"), a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 380;
    const img = i < 14;
    el.className = "boom " + (img ? "img" : "spark");
    if (img) el.style.backgroundImage = `url(${SYMBOLS[0].img})`;
    else el.style.background = colors[i % colors.length];
    el.style.setProperty("--x0", cx + "px");
    el.style.setProperty("--y0", cy + "px");
    el.style.setProperty("--x1", cx + Math.cos(a) * d + "px");
    el.style.setProperty("--y1", cy + Math.sin(a) * d * .7 + 140 * Math.random() + "px");
    el.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    el.style.animationDelay = Math.random() * .25 + "s";
    document.body.append(el);
    setTimeout(() => el.remove(), 2000);
  }
}
function setReel(i, v) {
  slot.reels[i] = v;
  const img = $("#reels").children[i].firstElementChild;
  img.src = SYMBOLS[v].img;
}
function pullLever() {
  if (slot.spinning) return;
  slot.spinning = true;
  slot.result = "spin";
  showSlot();
  const lever = $("#lever"), reels = [...$("#reels").children];
  lever.classList.add("pulled");
  setTimeout(() => lever.classList.remove("pulled"), 260);
  const final = [rollSymbol(), rollSymbol(), rollSymbol()];
  const moving = [true, true, true];
  let tick = 0;
  reels.forEach(r => r.classList.add("spin"));
  const iv = setInterval(() => {
    tick++;
    reels.forEach((r, i) => {
      if (!moving[i]) return;
      setReel(i, Math.floor(Math.random() * SYMBOLS.length));
      r.classList.toggle("up", (tick + i) % 2 === 0);
      r.classList.toggle("dn", (tick + i) % 2 === 1);
    });
  }, 70);
  [700, 1100, 1500].forEach((t, i) => setTimeout(() => {
    moving[i] = false;
    reels[i].classList.remove("spin", "up", "dn");
    setReel(i, final[i]);
    replay(reels[i], "stop");
    if (i < 2) return;
    clearInterval(iv);
    const ids = final.map(v => SYMBOLS[v].id), same = ids.every(x => x === ids[0]);
    const rad = ids.filter(x => x === "radiance").length;
    slot.result = rad === 3 ? "jackpot" : rad === 2 ? "close" : same && ids[0] === "down" ? "down"
      : same && ids[0] === "spectre" ? "spectre" : same ? "triple" : "miss";
    slot.spins++;
    if (rad === 3) slot.jackpots++;
    slot.spinning = false;
    try { localStorage.setItem("slot", JSON.stringify({ spins: slot.spins, jackpots: slot.jackpots, reels: slot.reels })); } catch {}
    showSlot();
    const box = $("#slot");
    if (slot.result === "jackpot") fireworks();
    else if (slot.result === "close" || slot.result === "triple" || slot.result === "spectre") { replay(box, "near"); flash(false); }
    else if (slot.result === "down") { replay(box, "bust"); flash(true); }
  }, t));
}
slot.reels.forEach((v, i) => setReel(i, SYMBOLS[v] ? v : 0));
$("#lever").addEventListener("click", pullLever);

// Флэппи Боров: поросёнок прыгает между Радиками. Спрайты и шрифт грузятся при первом открытии.
const pigGame = (() => {
  const FONT_H = '"Sofia Sans Extra Condensed", "Arial Narrow", system-ui, sans-serif';
  const FONT_B = 'Inter, "Segoe UI", system-ui, sans-serif';
  const OUT = "#22121a";
  const G = { W: 400, H: 640, FLOOR: 562, PIG_X: 110, R: 15, PIG_S: .8, GRAV: 1500, JUMP: -430, VMAX: 640, SPEED: 150, SPEED_MAX: 255, GAP0: 172, GAPMIN: 128, SPACING: 240, SPACING_MIN: 212, BURN: 20, LEVEL: 10, LEVEL_MAX: 8 };
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pigRot = v => clamp(v / 600, -.45, 1.2);

  const SKINS = {
    base:    { name: "Розовый", a: "#ffc0cb", b: "#e87f9c", snout: "#ffa3b5", hoof: "#6d3a48", ear: "#e36f8f", nost: "#7b3a4b", blush: "#ff6f8e", eye: "#20141a" },
    spectre: { name: "Spectre", a: "#c1a6f5", b: "#6a44ba", snout: "#a385e6", hoof: "#2a1c4c", ear: "#5f3cae", nost: "#2a1c4c", blush: "#e05be0", eye: "#067f90" },
    midas:   { name: "Мидас",   a: "#ffe697", b: "#d99a2c", snout: "#f6cb63", hoof: "#7a5414", ear: "#c98a22", nost: "#7a5414", blush: "#ff9d3c", eye: "#3a2406" },
    ash:     { name: "Пепел",   a: "#7d6c69", b: "#332a28", snout: "#8d6a62", hoof: "#191312", ear: "#3b302d", nost: "#120d0c", blush: "#d65c58", eye: "#20141a" },
  };

  /* ───────── Модель поросёнка ───────── */
  function fillStroke(c, fill) { c.fillStyle = fill; c.fill(); c.stroke(); }
  function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function vGrad(c, y0, y1, a, b) { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }

  function leg(c, x, y, ang, sk) {
    c.save(); c.translate(x, y); c.rotate(ang);
    c.beginPath(); c.roundRect(-4.6, 0, 9.2, 13, 3.5); fillStroke(c, sk.b);
    c.beginPath(); c.roundRect(-4.6, 8.5, 9.2, 4.5, 2); fillStroke(c, sk.hoof);

  function puff(x, y, n, col, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = sp * (.4 + Math.random()); st.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .35 + Math.random() * .35, max: .7, r: 1.5 + Math.random() * 3.5, col }); } }

  let audio = null;
  function tone(type, f0, f1, dur, vol) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const o = audio.createOscillator(), g = audio.createGain(), f = audio.createBiquadFilter(), n = audio.currentTime;
      o.type = type; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(f1, n + dur);
      f.type = "lowpass"; f.frequency.value = 1500;
      g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.001, n + dur);
      o.connect(f); f.connect(g); g.connect(audio.destination); o.start(n); o.stop(n + dur);
    } catch {}
  }
  const oink = () => { tone("sawtooth", 300, 140, .13, .08); tone("square", 150, 90, .13, .03); };

  function press() {
    if (st.mode === "dead") { if (st.deadT > .5) { reset(); } return; }
    if (st.mode === "ready") st.mode = "play";
    st.v = G.JUMP; oink(); puff(G.PIG_X - 12, st.y + 16, 5, "#c9c2b8", 45);
  }
  function die(blade) {
    st.mode = "dead"; st.deadT = 0; st.hitBlade = blade; st.shake = REDUCED ? 0 : .3; st.flash = 1; st.v = blade ? -220 : 0;
    puff(G.PIG_X, st.y, blade ? 22 : 9, blade ? "#ff9b35" : "#c9c2b8", 150);
    tone("square", 150, 42, .35, .1);
    if (st.score > best) { best = st.score; store.set("pigBest", best); show(); }
  }
  function step(dt) {
    st.t += dt;
    st.shake = Math.max(0, st.shake - dt); st.flash = Math.max(0, st.flash - dt * 3); st.burn = Math.max(0, st.burn - dt); st.lvlT = Math.max(0, st.lvlT - dt);
    for (const p of st.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 110 * dt; p.life -= dt; }
    st.parts = st.parts.filter(p => p.life > 0);
    for (const f of st.floats) { f.y -= 42 * dt; f.life -= dt; }
    st.floats = st.floats.filter(f => f.life > 0);
    if (st.mode === "ready") { st.y = 290 + Math.sin(st.t * 3) * 9; st.v = Math.cos(st.t * 3) * 40; st.off += 20 * dt; return; }
    st.v = Math.min(st.v + G.GRAV * dt, G.VMAX); st.y += st.v * dt;
    if (st.mode === "dead") {
      st.deadT += dt;
      if (st.y > G.FLOOR - 16) { st.y = G.FLOOR - 16; st.v = 0; }
      return;
    }
    const sp = speed(); st.off += sp * dt;
    st.trailT += dt; if (st.trailT > .035) { st.trailT = 0; st.trail.unshift(st.y); st.trail.length = Math.min(st.trail.length, 6); }
    for (const p of st.pillars) {
      p.x -= sp * dt;
      if (p.amp) p.gc = p.base + Math.sin(p.ph + st.t * p.w) * p.amp;
      if (Math.abs(p.x - G.PIG_X) < 110) {
        const d = Math.min(polyDist(G.PIG_X, st.y, topPoly(p.x, p.gc - p.gap / 2)), polyDist(G.PIG_X, st.y, botPoly(p.x, p.gc + p.gap / 2)));
        if (d < G.R) { die(true); return; }
        if (d < G.R + G.BURN) {
          if (!p.burned && st.burn <= 0) puff(G.PIG_X, st.y - 8, 4, "#8a8078", 30);
          p.burned = true; st.burn = .25;
          if (Math.random() < dt * 18) puff(G.PIG_X - 8, st.y - 8, 1, "#ff9b35", 40);
        }
      }
      if (!p.scored && p.x + GUARD < G.PIG_X - G.R) {
        p.scored = true; st.score += p.burned ? 2 : 1;
        st.floats.push({ x: G.PIG_X + 18, y: st.y - 28, txt: p.burned ? S.pig.burn : "+1", col: p.burned ? "#ff9b35" : "#ffe39a", life: .8 });
        tone("triangle", 780, p.burned ? 1660 : 1180, .12, .06);
        if (level() > st.lvl) { st.lvl = level(); st.lvlT = 1.6; tone("triangle", 520, 1040, .25, .07); tone("triangle", 780, 1560, .3, .05); }
      }
    }
    if (st.pillars[0].x < -90) st.pillars.shift();
    while (st.pillars[st.pillars.length - 1].x < G.W + G.SPACING) spawn();
    if (st.y > G.FLOOR - 16) { st.y = G.FLOOR - 16; die(false); return; }
    if (st.y < -30) { st.y = -30; st.v = 0; }
  }
  function txt(c, s, x, y, size, col, align = "center", weight = 800, font = FONT_H, maxW = 360) {
    c.font = `${weight} ${size}px ${font}`; c.textAlign = align; c.textBaseline = "alphabetic"; c.fillStyle = col; c.fillText(s, x, y, maxW);
  }
  const verdict = n => S.pig.verdicts[n === 0 ? 0 : n < 5 ? 1 : n < 15 ? 2 : n < 30 ? 3 : 4];
  function drawPigGame(c) {
    const sk = st.mode === "dead" && st.hitBlade ? SKINS.ash : SKINS[skinId];
    const legs = clamp(st.v / 500, -1, 1) * -.55, ear = clamp(st.v / 400, -1, 1);
    let face = "normal";
    if (st.mode === "dead") face = "dead";
    else if (st.burn > 0) face = "burn";
    else if (st.mode === "play" && st.v < -120) face = "wide";
    else if (st.mode === "play" && st.v > 300) face = "down";
    if (skinId === "spectre" && st.mode === "play") {
      st.trail.forEach((y, i) => { c.save(); c.globalAlpha = .2 - i * .03; pigSide(c, { x: G.PIG_X - (i + 1) * 13, y, s: G.PIG_S, rot: pigRot(st.v), skin: sk, legs, ear, face: "normal" }); c.restore(); });
    }
    pigSide(c, { x: G.PIG_X, y: st.y, s: G.PIG_S, rot: st.mode === "dead" && st.y >= G.FLOOR - 16 ? 1.45 : pigRot(st.v), skin: sk, legs, ear, face });
  }
  function render() {
    const c = ctx;
    c.setTransform(k, 0, 0, k, 0, 0);
    c.save();
    if (st.shake > 0) c.translate((Math.random() - .5) * 26 * st.shake, (Math.random() - .5) * 26 * st.shake);
    drawBack(c, st.off);
    for (const p of st.pillars) if (p.x > -100 && p.x < G.W + 100) {
      drawTopSword(c, p.x, p.gc - p.gap / 2, st.t);
      drawBotSword(c, p.x, p.gc + p.gap / 2, st.t, G.FLOOR);
    }
    drawGround(c, st.off);
    drawPigGame(c);
    for (const p of st.parts) { c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.col; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
    c.globalAlpha = 1;
    for (const f of st.floats) { c.globalAlpha = clamp(f.life * 2, 0, 1); txt(c, f.txt, f.x, f.y, 30, f.col); }
    c.globalAlpha = 1;
    c.restore();
    if (st.flash > 0) { c.fillStyle = `rgba(255,190,110,${st.flash * .5})`; c.fillRect(0, 0, G.W, G.H); }
    c.lineJoin = "round";
    if (st.mode === "play") {
      c.font = `800 84px ${FONT_H}`; c.textAlign = "center"; c.strokeStyle = "#0c0f13"; c.lineWidth = 7; c.strokeText(st.score, G.W / 2, 88);
      txt(c, st.score, G.W / 2, 88, 84, "#ffe39a");
      c.font = `800 22px ${FONT_H}`; c.lineWidth = 5; c.strokeText(S.pig.level(st.lvl), G.W / 2, 114);
      txt(c, S.pig.level(st.lvl), G.W / 2, 114, 22, "#c9d1dc");
      if (st.lvlT > 0) {
        const a = clamp(st.lvlT * 2, 0, 1), y = 210 - (1.6 - st.lvlT) * 14;
        c.globalAlpha = a; c.font = `800 52px ${FONT_H}`; c.strokeStyle = "#0c0f13"; c.lineWidth = 7; c.strokeText(S.pig.levelUp(st.lvl), G.W / 2, y);
        txt(c, S.pig.levelUp(st.lvl), G.W / 2, y, 52, "#e3ae45"); c.globalAlpha = 1;
      }
    }
    if (st.mode === "ready") {
      c.font = `800 25px ${FONT_H}`;
      const hw = Math.min(c.measureText(S.pig.hint).width, 230) + 28;
      c.fillStyle = "rgba(12,15,19,.72)"; c.beginPath(); c.roundRect(20, 512, hw, 40, 8); c.fill();
      txt(c, S.pig.hint, 20 + hw / 2, 539, 25, "#eceef2", "center", 800, FONT_H, 230);
      c.font = `800 62px ${FONT_H}`; c.textAlign = "left"; c.strokeStyle = "#0c0f13"; c.lineWidth = 7;
      c.strokeText(S.pig.title[0], 22, 72); c.strokeText(S.pig.title[1], 22, 124);
      txt(c, S.pig.title[0], 22, 72, 62, "#eceef2", "left"); txt(c, S.pig.title[1], 22, 124, 62, "#e3ae45", "left");
      if (best) txt(c, S.pig.best(best), 24, 156, 26, "#eceef2", "left");
    }
    if (st.mode === "dead" && st.deadT > .35) {
      const a = clamp((st.deadT - .35) * 4, 0, 1); c.globalAlpha = a;
      c.fillStyle = "rgba(12,15,19,.9)"; c.strokeStyle = "#262d36"; c.lineWidth = 1.5;
      c.beginPath(); c.roundRect(48, 176, 304, 248, 12); c.fill(); c.stroke();
      txt(c, `−25 ${S.mmr}`, G.W / 2, 256, 76, "#d65c58");
      txt(c, verdict(st.score), G.W / 2, 292, 28, "#eceef2", "center", 800, FONT_H, 284);
      txt(c, String(st.score), 138, 352, 56, "#ffe39a"); txt(c, S.pig.score, 138, 374, 22, "#8d97a5");
      txt(c, String(best), 262, 352, 56, "#e3ae45"); txt(c, S.pig.record, 262, 374, 22, "#8d97a5");
      if (st.deadT > .5) txt(c, S.pig.again, G.W / 2, 408, 23, "#eceef2", "center", 800, FONT_H, 284);
      c.globalAlpha = 1;
    }
  }

  const dlg = $("#pigDlg"), btn = $("#pigBtn"), skinsEl = $("#pigSkins"), muteEl = $("#pigMute");
  let raf = 0, last = 0, acc = 0, loaded = false;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now; acc += dt;
    const FIX = 1 / 120;
    while (acc >= FIX) { step(FIX); acc -= FIX; }
    render();
    raf = requestAnimationFrame(frame);
  }
  function loadOnce() {
    if (loaded) return;
    loaded = true;
    const l = document.createElement("link"); l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@800&display=swap";
    l.onload = () => document.fonts?.load(`800 62px "Sofia Sans Extra Condensed"`, "ФЛЭППИ FLAPPY 0123").catch(() => {});
    document.head.append(l);
    makeSprites();
  }
  function open() {
    loadOnce(); reset(); show();
    dlg.showModal(); fit(); cv.focus({ preventScroll: true });
    last = performance.now(); acc = 0; raf = requestAnimationFrame(frame);
  }
  function show() {
    $("#pigName").textContent = S.pig.btn;
    $("#pigSub").textContent = best ? S.pig.best(best) : S.pig.play;
    $("#pigTitle").textContent = S.pig.btn;
    $("#pigClose").setAttribute("aria-label", S.pig.close);
    cv.setAttribute("aria-label", S.pig.aria);
    muteEl.textContent = soundOn ? S.pig.soundOn : S.pig.soundOff;
    muteEl.setAttribute("aria-pressed", String(!soundOn));
    skinsEl.setAttribute("aria-label", S.pig.skin);
    skinsEl.querySelectorAll("button").forEach(b => {
      b.textContent = S.pig.skins[b.dataset.id];
      b.setAttribute("aria-pressed", String(b.dataset.id === skinId));
    });
  }
  for (const id of Object.keys(SKINS)) {
    const b = document.createElement("button"); b.type = "button"; b.dataset.id = id;
    b.addEventListener("click", () => { skinId = id; store.set("pigSkin", id); show(); cv.focus({ preventScroll: true }); });
    skinsEl.append(b);
  }
  muteEl.addEventListener("click", () => { soundOn = !soundOn; store.set("pigSound", soundOn ? "1" : "0"); show(); cv.focus({ preventScroll: true }); });
  btn.addEventListener("click", open);
  $("#pigClose").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("close", () => { cancelAnimationFrame(raf); btn.focus({ preventScroll: true }); });
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.focus({ preventScroll: true }); press(); });
  dlg.addEventListener("keydown", e => {
    if (e.target.tagName === "BUTTON") return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); if (!e.repeat) press(); }
  });
  // Значок на кнопке: та же модель, что в игре
  const icon = $("#pigIcon"), ic = icon.getContext("2d");
  ic.scale(144 / 34, 144 / 34);
  pigSide(ic, { x: 16, y: 15, s: .38, rot: -.1, skin: SKINS.base, legs: .3, ear: -.4, face: "wide" });
  return { show, open };
})();

// Зал славы: список ведётся в clips.json, названия и превью дотягивает scripts/clips.py.
let CLIPS = [];
async function loadClips() {
  try {
    const r = await fetch("clips.json", { cache: "no-store" });
    if (r.ok) CLIPS = (await r.json()).filter(c => c.slug);
  } catch {}
  renderClips();
}
function renderClips() {
  const el = $("#fame");
  el.hidden = !CLIPS.length;
  if (!CLIPS.length) return;
  el.innerHTML = `<div class="ch"><h2>${S.fame}</h2><span class="sub">${S.fameSub(CLIPS.length)}</span>
    <div class="nav"><button type="button" data-dir="-1" aria-label="${S.clipPrev}">‹</button><button type="button" data-dir="1" aria-label="${S.clipNext}">›</button></div></div>
  <div class="clips">${CLIPS.map(c => {
    const t = c.title || c.slug;
    return `<article class="clip">
      <div class="pl">
        <button type="button" data-clip="${esc(c.slug)}" aria-label="${esc(S.clipPlay(t))}">${c.thumb ? `<img src="${esc(c.thumb)}" alt="" loading="lazy">` : ""}</button>
        ${c.duration ? `<span class="len">${Math.floor(c.duration / 60)}:${String(c.duration % 60).padStart(2, "0")}</span>` : ""}
      </div>
      <div class="cap"><b>${esc(t)}</b><a href="https://clips.twitch.tv/${esc(c.slug)}" target="_blank" rel="noopener">${esc(S.clipBy(c.author || "Twitch"))} ↗</a></div>
    </article>`;
  }).join("")}</div>`;
  clipAt = Math.min(clipAt, CLIPS.length - 1);
  placeClips();
}
// Карточка по центру — большая и сразу кликабельная, соседи по бокам; лента замкнута в кольцо.
let clipAt = 0;
function placeClips(focus) {
  const cards = [...document.querySelectorAll("#fame .clip")], n = cards.length;
  cards.forEach((c, k) => {
    let o = ((k - clipAt) % n + n) % n;
    if (o > n / 2) o -= n;
    // через «шов» кольца карточка перелетает без анимации, иначе проедет через центр
    c.classList.toggle("jump", c.style.getPropertyValue("--o") !== "" && Math.abs(o - c.style.getPropertyValue("--o")) > 1);
    c.style.setProperty("--o", o);
    c.classList.toggle("on", !o);
    c.classList.toggle("near", Math.abs(o) === 1);
    c.classList.toggle("far", Math.abs(o) > 1);
    c.querySelectorAll("button, a").forEach(x => x.tabIndex = o ? -1 : 0);
    // ушла из центра — глушим плеер и возвращаем превью
    const f = c.querySelector("iframe");
    if (o && f?._btn) f.replaceWith(f._btn);
  });
  if (focus) cards[clipAt]?.querySelector("button[data-clip]")?.focus({ preventScroll: true });
}
function stepClips(d, focus) {
  if (!CLIPS.length) return;
  clipAt = ((clipAt + d) % CLIPS.length + CLIPS.length) % CLIPS.length;
  placeClips(focus);
}
$("#fame").addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  e.preventDefault();
  stepClips(e.key === "ArrowLeft" ? -1 : 1, true);
});
let swipeX = null;
$("#fame").addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") swipeX = e.clientX; });
$("#fame").addEventListener("pointerup", e => {
  if (swipeX == null) return;
  const dx = e.clientX - swipeX;
  swipeX = null;
  if (Math.abs(dx) > 40) stepClips(dx < 0 ? 1 : -1);
});
$("#fame").addEventListener("click", e => {
  const nav = e.target.closest("button[data-dir]");
  if (nav) return stepClips(+nav.dataset.dir);
  const side = e.target.closest(".clip:not(.on)");
  if (side) return stepClips(+side.style.getPropertyValue("--o"), true);
  const b = e.target.closest("button[data-clip]");
  if (!b) return;
  // Twitch пускает встраивание только с домена из parent
  const f = document.createElement("iframe");
  f.src = `https://clips.twitch.tv/embed?clip=${encodeURIComponent(b.dataset.clip)}&parent=${location.hostname}&autoplay=true`;
  f.allowFullscreen = true;
  f.allow = "autoplay; fullscreen";
  f.title = b.getAttribute("aria-label");
  f._btn = b;
  b.replaceWith(f);
});

// Статус стрима: у Twitch API нужен токен, decapi.me отдаёт его без ключа и с CORS.
// Ответ — «tupa_borov is offline» или аптайм вида «2 hours, 15 minutes, 3 seconds».
let twitch = null;
async function loadTwitch() {
  try {
    const r = await fetch("https://decapi.me/twitch/uptime/tupa_borov", { cache: "no-store" });
    const t = (await r.text()).trim();
    if (!r.ok) throw new Error(r.status);
    if (/offline/i.test(t)) twitch = { live: false };
    else {
      const h = +(t.match(/(\d+) hour/) || [0, 0])[1], m = +(t.match(/(\d+) minute/) || [0, 0])[1];
      twitch = /second|minute|hour/.test(t) ? { live: true, h, m } : null;
    }
  } catch { twitch = null; }
  showTwitch();
}
function showTwitch() {
  const el = $("#twStatus");
  if (!el) return;
  el.className = "tws" + (twitch?.live ? " on" : "");
  el.textContent = !twitch ? "" : twitch.live ? S.twLive(twitch.h ? `${twitch.h}${S.hr} ${twitch.m}${S.min}` : `${twitch.m}${S.min}`) : S.twOff;
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
applyLang(lang);

function drawRegions(rs) {
  const el = $("#regionChart");
  if (!el) return;
  // Столбец — винрейт региона; пунктир на 50% показывает, где регион «в плюс».
  const W = 440, H = 270, L = 38, R = 8, T = 26, B = 46;
  const n = rs.length, cw = (W - L - R) / n, bw = Math.min(46, cw * .62);
  const y = v => T + (100 - v) / 100 * (H - T - B);
  let g = "";
  for (let v = 0; v <= 100; v += 25) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`;
  const bars = rs.map((r, i) => {
    const name = S.groups[r.group] ?? S.otherRegion;
    const wr = Math.round(r.w / r.n * 100), cx = L + cw * (i + .5);
    const top = y(wr), h = Math.max(2, y(0) - top), rr = Math.min(4, h / 2);
    // скругляем только верх столбца, низ стоит на нуле
    const path = `M${cx - bw / 2},${y(0)}V${top + rr}Q${cx - bw / 2},${top} ${cx - bw / 2 + rr},${top}H${cx + bw / 2 - rr}Q${cx + bw / 2},${top} ${cx + bw / 2},${top + rr}V${y(0)}Z`;
    // в подсказке — из каких серверов собрана группа
    const parts = (r.parts || []).map(p => `${esc(p.region ?? S.unknownSrv)}${p.region == null && p.clusters.length ? ` (${S.clusters} ${p.clusters.join(", ")})` : ""}: <span class="w">${p.w}W</span>–<span class="l">${p.n - p.w}L</span> · ${Math.round(p.w / p.n * 100)}%`).join("<br>");
    const t = `<b>${esc(name)}</b> · <span class="w">${r.w}W</span>–<span class="l">${r.n - r.w}L</span> · ${wr}% · ${games(r.n)}<br>${parts}`;
    return `<path d="${path}" fill="${wr >= 50 ? "#5cbf75" : "#d65c58"}" opacity=".85"/>
      <text class="lbl-v" x="${cx}" y="${top - 7}" text-anchor="middle">${wr}%</text>
      <text x="${cx}" y="${H - B + 18}" text-anchor="middle">${esc(name.length > 14 ? name.slice(0, 13) + "…" : name)}</text>
      <text x="${cx}" y="${H - B + 34}" text-anchor="middle" style="font-size:11px">${r.n}</text>
      <rect class="hit" x="${cx - cw / 2}" y="${T}" width="${cw}" height="${H - T}" data-tip="${esc(t)}"/>`;
  }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${S.regions}">
    ${g}<line class="ref" x1="${L}" x2="${W - R}" y1="${y(50)}" y2="${y(50)}"/>${bars}
  </svg>`;
}

load();
setInterval(load, 5 * 60000);
loadTwitch();
setInterval(loadTwitch, 2 * 60000);
loadClips();
setInterval(tickLive, 1000);
</script>
