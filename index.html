<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ТУПА БОРАВ: … ММР</title>
<meta name="description" content="Примерный MMR, последние 20 матчей и статистика игрока 226241953, обновление каждые 15 минут">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: дашборд на весь экран — 12-колоночная сетка карточек; палитра и иконки предметов те же, что в сравнении Яторо и Борова */
:root {
  --bg: #0c0f13;
  --panel: #151a20;
  --panel-2: #1d232b;
  --line: #262d36;
  --text: #eceef2;
  --muted: #8d97a5;
  --dim: #5f6875;
  --gold: #e3ae45;
  --win: #5cbf75;
  --loss: #d65c58;
  --borov: #4fb8cf;
  --f-head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --gap: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 14px; line-height: 1.5; font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 1280px) { .wrap { padding-left: 32px; padding-right: 32px; } :root { --gap: 18px; } }
h1, h2, h3 { font-family: var(--f-head); margin: 0; letter-spacing: .01em; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
.w { color: var(--win); }
.l { color: var(--loss); }
.g { color: var(--gold); }
.muted { color: var(--muted); }

/* header */
.top { border-bottom: 1px solid var(--line); background: radial-gradient(1200px 200px at 10% 0, #4fb8cf14, transparent 70%), radial-gradient(900px 200px at 90% 0, #e3ae4512, transparent 70%); }
.top .wrap { padding-block: 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.ava { width: 64px; height: 64px; border-radius: 12px; border: 2px solid var(--borov); object-fit: cover; background: var(--panel-2); }
.who h1 { font-size: 42px; font-weight: 800; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.who h1 .nick { color: var(--borov); font-weight: 600; text-transform: none; font-size: 30px; letter-spacing: 0; }
.who .meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 6px; }
.who .meta a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
.who .meta a:hover { color: var(--text); }
.live { margin-left: auto; display: grid; justify-items: end; gap: 2px; font-size: 13px; color: var(--muted); }
.live .dot { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--f-head); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.live .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--win); box-shadow: 0 0 0 0 #5cbf7580; animation: pulse 2s infinite; }
.live.stale .dot::before { background: var(--gold); animation: none; }
.live .timer { font: 800 46px var(--f-head); line-height: .95; color: var(--text); font-variant-numeric: tabular-nums; }
.live.due .timer { color: var(--gold); font-size: 26px; line-height: 1.6; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px #5cbf7500; } 100% { box-shadow: 0 0 0 0 #5cbf7500; } }

/* dashboard grid */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); padding-block: var(--gap) 28px; }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 1279px) { .c4 { grid-column: span 6; } .c4.wide-m { grid-column: span 12; } .c5, .c7, .c8 { grid-column: span 12; } }
@media (max-width: 820px) { .dash > * { grid-column: span 12 !important; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; min-width: 0; display: grid; gap: 14px; align-content: start; }
.card.acc-gold { box-shadow: inset 0 3px 0 var(--gold); }
.card.acc-blue { box-shadow: inset 0 3px 0 var(--borov); }
.card.acc-green { box-shadow: inset 0 3px 0 var(--win); }
.ch { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ch h2 { font-size: 24px; font-weight: 700; line-height: 1.1; }
.ch .sub { font-size: 13px; color: var(--muted); }
.lbl { font: 600 14px var(--f-head); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* MMR */
.mmr-line { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.mmr { font-family: var(--f-head); font-weight: 800; font-size: clamp(72px, 7vw, 112px); line-height: .85; color: var(--gold); letter-spacing: -.01em; }
.mmr small { font-size: .45em; color: #e3ae4599; margin-right: 4px; vertical-align: .35em; }
.rank b { font: 700 22px var(--f-head); color: var(--text); display: block; line-height: 1.1; }
.rank span { font-size: 13px; color: var(--muted); }
.goal { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.goal > b { font: 700 28px var(--f-head); line-height: 1.05; color: var(--text); }
.goal span { font-size: 13px; color: var(--muted); }
.goal .sep-dot { flex-basis: 100%; }
.deltas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.delta { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.delta .v { font: 700 28px var(--f-head); line-height: 1.05; }
.delta .s { font-size: 12px; color: var(--muted); }

/* form */
.wr-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.big { font-family: var(--f-head); font-weight: 800; font-size: 68px; line-height: .9; }
.wl { font: 700 22px var(--f-head); }
.strip { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; }
.strip i { height: 28px; border-radius: 3px; background: var(--loss); opacity: .85; }
.strip i.w { background: var(--win); opacity: 1; }
.strip i.e { background: var(--panel-2); opacity: 1; }
.cap { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.cap b { font-weight: 600; }

/* radiance */
.seg { display: inline-flex; background: var(--panel-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { font: 600 14px var(--f-head); letter-spacing: .04em; color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 0 #0006; }
.seg button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo > div { background: var(--panel-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.duo .hd { display: flex; align-items: center; gap: 8px; font: 600 16px var(--f-head); }
.duo .hd img { width: 34px; height: 25px; border-radius: 3px; }
.duo .hd .x { position: relative; display: inline-block; }
.duo .hd .x img { filter: grayscale(1) brightness(.5); display: block; }
.duo .hd .x::after { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 2px; background: var(--loss); transform: rotate(-32deg); }
.duo .pc { font: 800 44px var(--f-head); line-height: 1; }
.duo .n { font-size: 12px; color: var(--muted); }
.waffle { display: flex; flex-wrap: wrap; gap: 3px; }
.waffle i { width: 12px; height: 12px; border-radius: 2px; background: var(--loss); opacity: .75; }
.waffle i.w { background: var(--win); opacity: 1; }
.waffle i.r { outline: 2px solid var(--gold); outline-offset: -2px; opacity: 1; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend i.ln { width: 18px; height: 0; border-top: 2px solid var(--gold); border-radius: 0; vertical-align: middle; }

/* farm tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.tile .k { font: 600 13px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tile .v { font: 700 28px var(--f-head); line-height: 1.05; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tile .v .dl { margin-left: 0; font-size: 14px; }
.tile .s { font-size: 12px; color: var(--muted); }
.sep { border-top: 1px solid var(--line); margin: 2px 0; }
.streaks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.streaks .tile .v { font-size: 34px; }

/* weeks */
.wtab { width: 100%; border-collapse: collapse; font-size: 13px; }
.wtab th { text-align: right; font: 600 12px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
.wtab th:first-child, .wtab td:first-child { text-align: left; }
.wtab td { text-align: right; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.wtab tr:last-child td { border-bottom: 0; }
.wtab td b { font: 700 16px var(--f-head); }
.gbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--gold); vertical-align: middle; margin-right: 6px; opacity: .85; }

/* heroes */
.hlist { display: grid; gap: 2px; max-height: 420px; overflow-y: auto; margin-right: -8px; padding-right: 8px; }
.hrow { display: grid; grid-template-columns: 50px minmax(0, 1fr) 64px 54px; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.hrow:first-child { border-top: 0; }
.hrow img { width: 50px; height: 28px; border-radius: 4px; object-fit: cover; }
.hrow .nm { font: 600 17px var(--f-head); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); margin-top: 5px; overflow: hidden; display: flex; }
.bar .bw { background: var(--win); }
.bar .bl { background: var(--loss); opacity: .8; }
.hrow .wlc { font-size: 13px; color: var(--muted); text-align: right; }
.pct { font: 700 20px var(--f-head); text-align: right; }

/* items */
.ilist { display: grid; gap: 2px; }
.irow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 58px 60px; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.irow:first-child { border-top: 0; }
.irow img { width: 40px; height: 29px; border-radius: 4px; }
.irow .nm { font: 600 16px var(--f-head); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.irow .nm span { font: 400 12px var(--f-body); color: var(--muted); margin-left: 6px; }
.pair { display: grid; gap: 3px; margin-top: 5px; }
.pair span { height: 5px; border-radius: 3px; display: block; }
.pair .a { background: var(--gold); }
.pair .b { background: var(--dim); }
.irow .vs { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.25; }
.irow .vs b { font: 700 18px var(--f-head); display: block; }
.badge { font: 700 14px var(--f-head); padding: 3px 6px; border-radius: 5px; text-align: center; }
.badge.p { background: #5cbf7522; color: var(--win); }
.badge.n { background: #d65c5822; color: var(--loss); }
.badge.z { background: var(--panel-2); color: var(--muted); }

/* charts */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .sc { overflow-x: auto; }
.card.fill { grid-template-rows: auto minmax(0, 1fr); align-content: stretch; }
svg text { fill: var(--muted); font-family: var(--f-body); font-size: 12px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .lineGold { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
svg .area { fill: url(#gArea); }
svg .pt { fill: var(--bg); stroke: var(--gold); stroke-width: 2; }
svg .hit { fill: transparent; }
svg .lbl-v { fill: var(--text); font: 700 16px var(--f-head); }
.tip { position: fixed; pointer-events: none; background: #0a0c0ff2; border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font-size: 13px; line-height: 1.4; z-index: 10; display: none; max-width: 260px; }
.tip b { font-family: var(--f-head); font-size: 16px; }

/* match table */
.hist-wrap { overflow-x: auto; margin: 0 -22px -20px; }
table.h { width: 100%; min-width: 960px; border-collapse: collapse; font-size: 14px; }
table.h th { text-align: left; font: 600 13px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.h th:first-child, table.h td:first-child { padding-left: 22px; }
table.h th:last-child, table.h td:last-child { padding-right: 22px; }
table.h td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.h tr:last-child td { border-bottom: 0; }
table.h tr.win td:first-child { box-shadow: inset 3px 0 0 var(--win); }
table.h tr.loss td:first-child { box-shadow: inset 3px 0 0 var(--loss); }
table.h tbody tr:hover td { background: #ffffff05; }
table.h td.c, table.h th.c { text-align: right; }
.hero { display: flex; align-items: center; gap: 12px; }
.hero img { width: 59px; height: 33px; border-radius: 4px; object-fit: cover; background: var(--panel-2); }
.hero b { font: 600 18px var(--f-head); display: block; line-height: 1.1; }
.hero span, .sub { font-size: 12px; color: var(--muted); }
.res { font: 700 17px var(--f-head); display: block; line-height: 1.1; }
.kda b { font: 600 18px var(--f-head); }
.inv { display: flex; gap: 3px; align-items: center; }
.inv img, .inv .empty { width: 38px; height: 28px; border-radius: 3px; display: inline-block; }
.inv .empty { background: var(--panel-2); }
.inv .nt { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; margin-left: 6px; }
.mm { font: 700 18px var(--f-head); }
.dl { font: 700 13px var(--f-head); padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.dl.w { background: #5cbf7522; }
.dl.l { background: #d65c5822; }
.dl.m { background: var(--panel-2); color: var(--muted); }
td a { color: var(--muted); text-decoration: none; }
td a:hover { color: var(--text); text-decoration: underline; }
td a.db { display: inline-block; font: 600 13px var(--f-head); letter-spacing: .06em; text-transform: uppercase; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
td a.db:hover { border-color: var(--gold); color: var(--gold); text-decoration: none; }
td a.db:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

.foot { font-size: 13px; color: var(--muted); padding: 4px 0 28px; }
.foot b { color: var(--text); font-weight: 600; }
.err { padding: 80px 0; text-align: center; color: var(--muted); }
a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

@media (max-width: 820px) {
  .live { margin-left: 0; justify-items: start; }
  .who h1 { font-size: 34px; }
  .who h1 .nick { font-size: 24px; }
  .chart svg { min-width: 620px; }
}
@media (max-width: 480px) {
  .deltas { grid-template-columns: 1fr 1fr; }
  .strip i { height: 22px; }
  .duo { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <img class="ava" id="ava" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <div class="who">
      <h1>ТУПА БОРАВ <span class="nick" id="nick"></span></h1>
      <div class="meta">
        <span>ID 226241953</span>
        <a href="https://www.dotabuff.com/players/226241953" target="_blank" rel="noopener">Dotabuff</a>
        <a href="https://www.opendota.com/players/226241953" target="_blank" rel="noopener">OpenDota</a>
      </div>
    </div>
    <div class="live" id="live">
      <span class="dot" id="schedule">До планового обновления</span>
      <span class="timer" id="timer">--:--</span>
      <span id="upd"></span>
      <span id="source"></span>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <div class="err">Загружаю данные…</div>
</main>

<div class="tip" id="tip"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n == null ? "—" : n.toLocaleString("ru-RU");
const sign = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
const dur = s => s == null ? "—" : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const pct = o => o.n ? Math.round(o.w / o.n * 100) : null;
const dShort = iso => new Date(iso + "T00:00:00").toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "только что";
  if (m < 60) return `${m} мин назад`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ч ${m % 60} мин назад`;
  return `${Math.floor(h / 24)} дн назад`;
};
const when = iso => new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const games = n => `${n} ${n % 10 === 1 && n % 100 !== 11 ? "игра" : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? "игры" : "игр"}`;
const plural = (n, one, few, many) => n % 10 === 1 && n % 100 !== 11 ? one : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? few : many;
const GOAL = 7000;
const RANKS = ["", "Herald", "Guardian", "Crusader", "Archon", "Legend", "Ancient", "Divine", "Immortal"];
const RAD_IMG = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/radiance.png";

let DATA = null;
let radScope = "spectre";

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const next = await r.json();
    const changed = !DATA || next.updated_at !== DATA.updated_at;
    DATA = next;
    if (changed) render(DATA);
  } catch (e) {
    if (!DATA) $("#app").innerHTML = `<div class="err">Не удалось загрузить data.json (${esc(e.message)}). Попробую ещё раз через минуту.</div>`;
    setTimeout(load, 60000);
  }
}

// Сборщик стартует по крону каждые 15 минут (:00/:15/:30/:45 UTC), GitHub иногда запаздывает на несколько минут.
const SLOT = 15 * 60000;
const nextRun = () => Math.ceil((new Date(DATA.updated_at).getTime() + 1) / SLOT) * SLOT;
let lastPoll = 0;

function tickLive() {
  if (!DATA) return;
  const left = nextRun() - Date.now();
  const due = left <= 0;
  const txt = due ? "ожидаем обновление" : `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
  const sourceFailed = DATA.scrape_status === "unavailable";
  const sourceCached = DATA.scrape_status === "cached";
  const sourceStale = !DATA.scraped_at || Date.now() - new Date(DATA.scraped_at) > 45 * 60000;
  $("#schedule").textContent = due ? "Плановое обновление" : "До планового обновления";
  $("#timer").textContent = txt;
  $("#live").classList.toggle("due", due);
  $("#live").classList.toggle("stale", sourceFailed || sourceStale || Date.now() - new Date(DATA.updated_at) > 45 * 60000);
  $("#upd").textContent = `Пересчёт: ${ago(DATA.updated_at)}`;
  $("#source").textContent = `Данные Dotabuff: ${DATA.scraped_at ? ago(DATA.scraped_at) : "ещё не получены"}${sourceFailed ? " · источник недоступен" : sourceCached ? " · снимок из кэша jina" : ""}`;
  const foot = $("#foot");
  if (foot) foot.innerHTML = `Пересчёт: <b>${when(DATA.updated_at)}</b> · данные Dotabuff: <b>${DATA.scraped_at ? when(DATA.scraped_at) : "—"}</b>${sourceFailed ? " · Dotabuff недоступен, сохранены предыдущие данные" : ""} · плановое обновление: <b>${txt}</b>`;
  // как только слот прошёл — раз в минуту проверяем, не появились ли новые данные
  if (due && Date.now() - lastPoll > 60000) { lastPoll = Date.now(); load(); }
}

function farmTiles(f) {
  const T = [["GPM", "gpm", 0], ["XPM", "xpm", 0], ["Добивания/мин", "lhm", 1], ["Net worth", "nw", 0, v => (v / 1000).toFixed(1) + "k"], ["KDA", "kda", 1], ["Урон/мин", "hdm", 0]];
  return T.map(([name, key, digits, show]) => {
    const v = f.week[key], pv = f.prev[key], all = f.all[key];
    const view = x => x == null ? "—" : show ? show(x) : x.toFixed(digits);
    const dlt = v != null && pv != null ? v - pv : null;
    const dTxt = dlt == null ? "" : `<span class="dl ${dlt > 0 ? "w" : dlt < 0 ? "l" : "m"}">${dlt > 0 ? "+" : dlt < 0 ? "−" : "±"}${show ? show(Math.abs(dlt)) : Math.abs(dlt).toFixed(digits)}</span>`;
    return `<div class="tile"><span class="k">${name}</span><span class="v">${view(v)}${dTxt}</span><span class="s">за период ${view(all)}</span></div>`;
  }).join("");
}

function streakTile(name, s, cls) {
  if (!s) return `<div class="tile"><span class="k">${name}</span><span class="v">—</span></div>`;
  const a = when(s.from).slice(0, 5), b = when(s.to).slice(0, 5);
  return `<div class="tile"><span class="k">${name}</span><span class="v ${cls}">${s.n}</span><span class="s">${a === b ? a : `${a}–${b}`}</span></div>`;
}

function runs(ms, win) {
  let best = 0, cur = 0;
  for (const m of ms) { cur = m.win === win ? cur + 1 : 0; best = Math.max(best, cur); }
  return best;
}

function avgOf(ms, f, digits = 0, raw = false) {
  const v = ms.map(f).filter(x => x != null && !Number.isNaN(x));
  if (!v.length) return "—";
  const a = v.reduce((s, x) => s + x, 0) / v.length;
  return raw ? a : a.toFixed(digits);
}

function weeksTable(all) {
  // берём на одну неделю больше, чтобы у самой старой из показанных была дельта
  const ws = all.slice(-6), shown = 5;
  const max = Math.max(...ws.slice(-shown).map(w => w.gpm || 0));
  return `<table class="wtab"><thead><tr><th>Неделя</th><th>Игр</th><th>WR</th><th>GPM</th><th>Δ</th><th>XPM</th></tr></thead><tbody>
    ${ws.slice().reverse().map((w, i, arr) => {
      const prev = arr[i + 1];
      const dl = prev && w.gpm != null && prev.gpm != null ? Math.round(w.gpm - prev.gpm) : null;
      const wr = Math.round(w.w / w.n * 100);
      return `<tr><td>${dShort(w.week)}</td><td>${w.n}</td><td class="${wr >= 50 ? "w" : "l"}">${wr}%</td>
        <td><span class="gbar" style="width:${Math.round((w.gpm || 0) / max * 46)}px"></span><b>${w.gpm != null ? Math.round(w.gpm) : "—"}</b></td>
        <td>${dl == null ? "—" : `<span class="dl ${dl > 0 ? "w" : dl < 0 ? "l" : "m"}">${sign(dl)}</span>`}</td>
        <td>${w.xpm != null ? Math.round(w.xpm) : "—"}</td></tr>`;
    }).slice(0, shown).join("")}
  </tbody></table>`;
}

const tip = $("#tip");
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("pointerenter", e => { tip.innerHTML = el.dataset.tip; tip.style.display = "block"; moveTip(e); });
    el.addEventListener("pointermove", moveTip);
    el.addEventListener("pointerleave", () => tip.style.display = "none");
  });
}
function moveTip(e) {
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 12) + "px";
}

function niceRange(vals, pad) {
  return [Math.floor((Math.min(...vals) - pad) / 50) * 50, Math.ceil((Math.max(...vals) + pad) / 50) * 50];
}

// монотонная кубическая кривая (Fritsch–Carlson): плавно, но без выбросов выше/ниже точек
function smoothPath(ps) {
  const n = ps.length;
  if (n < 3) return ps.map(([px, py], i) => `${i ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`).join("");
  const dx = [], sl = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = ps[i + 1][0] - ps[i][0]; sl[i] = (ps[i + 1][1] - ps[i][1]) / dx[i]; }
  const m = [sl[0]];
  for (let i = 1; i < n - 1; i++) m[i] = sl[i - 1] * sl[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / sl[i - 1] + (dx[i] + 2 * dx[i - 1]) / sl[i]);
  m[n - 1] = sl[n - 2];
  let path = `M${ps[0][0].toFixed(1)},${ps[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3, [x0, y0] = ps[i], [x1, y1] = ps[i + 1];
    path += `C${(x0 + h).toFixed(1)},${(y0 + m[i] * h).toFixed(1)} ${(x1 - h).toFixed(1)},${(y1 - m[i + 1] * h).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return path;
}

function drawDays(d) {
  const el = $("#dayChart");
  // высота под карточку: убираем старый svg, меряем свободное место и подгоняем viewBox под него
  el.innerHTML = "";
  const box = el.parentElement;
  const W = 1100, L = 50, R = 16, T = 26, B = 30;
  const H = box.clientWidth && box.clientHeight > 200 ? Math.max(330, Math.floor(W * (box.clientHeight - 2) / box.clientWidth)) : 330;
  const DAY = 86400000;
  // точка старта — рейтинг до первой игры после патча, дневные точки — рейтинг на конец дня
  const t0 = new Date(d.history_from + "T00:00:00").getTime() - DAY;
  const startIso = new Date(t0 + 12 * 3600000).toISOString().slice(0, 10);
  const pts = [{ date: startIso, mmr: d.days.start, start: true }, ...d.days.points];
  const tEnd = new Date(pts[pts.length - 1].date + "T00:00:00").getTime();
  const [lo, hi] = niceRange(pts.map(p => p.mmr), 40);
  const x = date => L + (new Date(date + "T00:00:00").getTime() - t0) / Math.max(DAY, tEnd - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = (hi - lo) / 50 > 8 ? 100 : 50;
  let g = "";
  for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let t = t0; t <= tEnd; t += 7 * DAY) {
    const dd = new Date(t), iso = new Date(t + 12 * 3600000).toISOString().slice(0, 10);
    g += `<text x="${x(iso)}" y="${H - 8}" text-anchor="middle">${String(dd.getDate()).padStart(2, "0")}.${String(dd.getMonth() + 1).padStart(2, "0")}</text>`;
  }
  const line = smoothPath(pts.map(p => [x(p.date), y(p.mmr)]));
  const area = line + `L${x(pts[pts.length - 1].date)},${H - B}L${x(pts[0].date)},${H - B}Z`;
  const last = pts[pts.length - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Рейтинг по дням">
    <defs><linearGradient id="gArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3ae45" stop-opacity=".22"/><stop offset="1" stop-color="#e3ae45" stop-opacity="0"/></linearGradient></defs>
    ${g}
    <text x="${L + 4}" y="${T + 4}">патч 7.41e</text>
    <path class="area" d="${area}"/>
    <path class="lineGold" d="${line}"/>
    ${pts.map((p, i) => {
      const t = p.start ? `<b>${p.mmr}</b><br>до первой игры после патча 7.41e` : `<b>${p.mmr}</b><br>${dShort(p.date)} · <span class="w">${p.w}W</span>–<span class="l">${p.l}L</span> · ${sign(p.mmr - pts[i - 1].mmr)}`;
      return `${p === last ? `<circle class="pt" cx="${x(p.date)}" cy="${y(p.mmr)}" r="5"/>` : ""}<circle class="hit" cx="${x(p.date)}" cy="${y(p.mmr)}" r="12" data-tip="${esc(t)}"/>`;
    }).join("")}
    <text class="lbl-v" x="${x(last.date) - 10}" y="${y(last.mmr) - 12}" text-anchor="end">≈${last.mmr}</text>
  </svg>`;
}

function drawMatches(d) {
  const el = $("#matchChart");
  const ms = [...d.matches].reverse();
  if (!ms.length) { el.innerHTML = ""; return; }
  const W = 1100, H = 280, L = 50, R = 16, T = 26, B = 64;
  const [lo, hi] = niceRange(ms.flatMap(m => [m.mmr_after, m.mmr_after - m.delta]), 20);
  const n = ms.length, cw = (W - L - R) / n;
  const cx = i => L + cw * (i + .5);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi; v += 50) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const line = ms.map((m, i) => `${i ? "L" : "M"}${cx(i).toFixed(1)},${y(m.mmr_after).toFixed(1)}`).join("");
  const iw = Math.min(44, cw - 6), ih = iw * 0.5625;
  const bars = ms.map((m, i) => {
    const y0 = y(m.mmr_after - m.delta), y1 = y(m.mmr_after);
    const col = m.win ? "#5cbf75" : "#d65c58";
    const t = `<b class="${m.win ? "w" : "l"}">${m.win ? "Победа" : "Поражение"}</b> · ${esc(m.hero)}<br>${when(m.start)} · ${dur(m.duration)}<br>${m.k}/${m.d}/${m.a}${m.nw ? ` · NW ${(m.nw / 1000).toFixed(1)}k` : ""}<br>рейтинг ${m.mmr_after} (${sign(m.delta)})`;
    return `<rect x="${cx(i) - Math.min(11, cw / 3)}" y="${Math.min(y0, y1)}" width="${Math.min(22, cw / 1.5)}" height="${Math.max(2, Math.abs(y1 - y0))}" rx="2" fill="${col}" opacity=".75"/>
      <image href="${esc(m.hero_img)}" x="${cx(i) - iw / 2}" y="${H - B + 14}" width="${iw}" height="${ih}" preserveAspectRatio="xMidYMid slice"/>
      <rect x="${cx(i) - iw / 2}" y="${H - B + 17 + ih}" width="${iw}" height="3" rx="1.5" fill="${col}"/>
      <rect class="hit" x="${cx(i) - cw / 2}" y="${T}" width="${cw}" height="${H - T}" data-tip="${esc(t)}"/>`;
  }).join("");
  const last = ms[n - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Рейтинг по последним матчам">
    ${g}${bars}
    <path class="lineGold" d="${line}" pointer-events="none"/>
    ${ms.map((m, i) => `<circle class="pt" cx="${cx(i)}" cy="${y(m.mmr_after)}" r="${i === n - 1 ? 5 : 3}" pointer-events="none"/>`).join("")}
    <text class="lbl-v" x="${cx(n - 1) - 8}" y="${y(last.mmr_after) - 12}" text-anchor="end">≈${last.mmr_after}</text>
  </svg>`;
}

load();
setInterval(load, 5 * 60000);
setInterval(tickLive, 1000);
</script>
</body>
