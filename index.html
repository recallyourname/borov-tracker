<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Габриель: рейтинг и матчи</title>
<meta name="description" content="Примерный MMR и последние 20 матчей игрока 226241953, обновление каждые 15 минут">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700;800&family=Fira+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: та же плоская «игровая» стат-страница, что у сравнения Яторо и Борова — одна колонка 1080px, иконки героев и предметов вместо подписей */
:root {
  --bg: #0f1216;
  --panel: #171b21;
  --panel-2: #1e232b;
  --line: #2a3039;
  --text: #e6e8ec;
  --muted: #8a93a0;
  --gold: #e3ae45;
  --win: #5cbf75;
  --loss: #d65c58;
  --borov: #4fb8cf;
  --f-head: "Fira Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Fira Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance; letter-spacing: .005em; }
p { margin: 0; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.w { color: var(--win); }
.l { color: var(--loss); }

/* header */
.top { border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #4fb8cf0d, transparent 70%); }
.top .wrap { padding-block: 28px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.ava { width: 72px; height: 72px; border-radius: 10px; border: 2px solid var(--borov); object-fit: cover; background: var(--panel-2); }
.who h1 { font-size: 34px; font-weight: 800; line-height: 1.05; }
.who h1 .nick { color: var(--borov); }
.who .meta { color: var(--muted); font-size: 14px; display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 4px; }
.who .meta a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
.who .meta a:hover { color: var(--text); }
.live { margin-left: auto; display: grid; justify-items: end; gap: 2px; font-size: 13px; color: var(--muted); }
.live .dot { display: inline-flex; align-items: center; gap: 7px; font: 600 14px var(--f-head); color: var(--text); }
.live .dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--win); box-shadow: 0 0 0 0 #5cbf7580; animation: pulse 2s infinite; }
.live.stale .dot::before { background: var(--gold); animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px #5cbf7500; } 100% { box-shadow: 0 0 0 0 #5cbf7500; } }

section { border-bottom: 1px solid var(--line); }
section > .wrap { padding-block: 36px; display: grid; gap: 20px; }
.sh { display: grid; gap: 4px; max-width: 70ch; }
.sh h2 { font-size: 26px; font-weight: 700; line-height: 1.15; }
.sh p { color: var(--muted); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0; }

/* rating hero */
.score { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.mmr-card { border-top: 3px solid var(--gold); display: grid; gap: 14px; align-content: start; }
.lbl { font: 600 13px var(--f-head); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.mmr-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.mmr { font-family: var(--f-head); font-weight: 800; font-size: 88px; line-height: .9; color: var(--gold); }
.mmr small { font-size: 40px; color: #e3ae4599; margin-right: 2px; }
.rank { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.rank b { font: 700 18px var(--f-head); color: var(--text); }
.deltas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.delta { background: var(--panel-2); border-radius: 6px; padding: 10px 12px; }
.delta .v { font: 700 24px var(--f-head); line-height: 1.1; }
.delta .s { font-size: 12px; color: var(--muted); }

.form-card { border-top: 3px solid var(--borov); display: grid; gap: 14px; align-content: start; }
.wr-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.wr { font-family: var(--f-head); font-weight: 800; font-size: 64px; line-height: 1; }
.wl { font: 600 18px var(--f-head); }
.strip { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; }
.strip i { height: 26px; border-radius: 3px; background: var(--loss); opacity: .85; position: relative; }
.strip i.w { background: var(--win); opacity: 1; }
.strip i.e { background: var(--panel-2); opacity: 1; }
.cap { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.streak { font-size: 14px; }
.heroes { display: flex; gap: 10px; flex-wrap: wrap; }
.hchip { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border-radius: 6px; padding: 6px 10px 6px 6px; }
.hchip img { width: 44px; height: 25px; border-radius: 3px; object-fit: cover; }
.hchip b { font: 600 15px var(--f-head); display: block; line-height: 1.1; }
.hchip span { font-size: 12px; color: var(--muted); }

/* charts */
.chart { display: grid; gap: 10px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .sc { overflow-x: auto; }
svg text { fill: var(--muted); font-family: var(--f-body); font-size: 12px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .lineGold { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
svg .dash { fill: none; stroke: var(--gold); stroke-width: 2; stroke-dasharray: 5 5; opacity: .6; }
svg .area { fill: url(#gArea); }
svg .pt { fill: var(--bg); stroke: var(--gold); stroke-width: 2; }
svg .hit { fill: transparent; cursor: default; }
svg .lbl-v { fill: var(--text); font: 700 13px var(--f-head); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--gold); vertical-align: middle; margin-right: 6px; }
.legend i.d { border-top-style: dashed; opacity: .7; }
.legend i.b { width: 10px; height: 10px; border: 0; border-radius: 2px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; background: #0b0d10f2; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 13px; line-height: 1.35; z-index: 10; display: none; max-width: 240px; }
.tip b { font-family: var(--f-head); font-size: 15px; }

/* match list */
.hist-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.h { width: 100%; min-width: 900px; border-collapse: collapse; font-size: 14px; }
table.h th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 10px; background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.h td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
table.h tr:last-child td { border-bottom: 0; }
table.h tr.win td:first-child { box-shadow: inset 3px 0 0 var(--win); }
table.h tr.loss td:first-child { box-shadow: inset 3px 0 0 var(--loss); }
table.h tr:hover td { background: #ffffff06; }
table.h td.c, table.h th.c { text-align: right; }
.hero { display: flex; align-items: center; gap: 10px; }
.hero img { width: 55px; height: 31px; border-radius: 4px; object-fit: cover; background: var(--panel-2); }
.hero b { font: 600 15px var(--f-head); display: block; line-height: 1.15; }
.hero span { font-size: 12px; color: var(--muted); }
.res { font: 700 15px var(--f-head); display: block; line-height: 1.15; }
.res.w { color: var(--win); }
.res.l { color: var(--loss); }
.sub { font-size: 12px; color: var(--muted); }
.kda b { font-family: var(--f-head); font-size: 15px; font-weight: 600; }
.kda .k { color: var(--text); }
.inv { display: flex; gap: 3px; align-items: center; }
.inv img, .inv .empty { width: 36px; height: 26px; border-radius: 3px; display: inline-block; }
.inv .empty { background: var(--panel-2); }
.inv .nt { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; margin-left: 6px; }
.mm { font: 700 15px var(--f-head); }
.dl { font: 600 12px var(--f-head); padding: 1px 5px; border-radius: 4px; margin-left: 6px; }
.dl.w { background: #5cbf7522; }
.dl.l { background: #d65c5822; }
.dl.m { background: var(--panel-2); color: var(--muted); }
td a { color: var(--muted); text-decoration: none; }
td a:hover { color: var(--text); text-decoration: underline; }

.note { font-size: 13px; color: var(--muted); max-width: 80ch; display: grid; gap: 6px; }
.note b { color: var(--text); font-weight: 500; }
.err { padding: 60px 0; text-align: center; color: var(--muted); }
a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

@media (max-width: 820px) {
  .score { grid-template-columns: 1fr; }
  .mmr { font-size: 72px; }
  .live { margin-left: 0; justify-items: start; }
}
@media (max-width: 640px) {
  .chart svg { min-width: 620px; }
}
@media (max-width: 480px) {
  .who h1 { font-size: 28px; }
  .deltas { grid-template-columns: 1fr 1fr; }
  .strip i { height: 20px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <img class="ava" id="ava" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <div class="who">
      <h1>Габриель <span class="nick" id="nick"></span></h1>
      <div class="meta">
        <span>ID 226241953</span>
        <a href="https://www.dotabuff.com/players/226241953" target="_blank" rel="noopener">Dotabuff</a>
        <a href="https://www.opendota.com/players/226241953" target="_blank" rel="noopener">OpenDota</a>
      </div>
    </div>
    <div class="live" id="live">
      <span class="dot" id="upd">Загружаю…</span>
      <span id="next"></span>
    </div>
  </div>
</header>

<main id="app">
  <div class="wrap err" id="loading">Загружаю данные…</div>
</main>

<div class="tip" id="tip"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => n == null ? "—" : n.toLocaleString("ru-RU");
const sign = n => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n);
const dur = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const dShort = iso => new Date(iso + "T00:00:00").toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "только что";
  if (m < 60) return `${m} мин назад`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} ч ${m % 60} мин назад`;
  return `${Math.floor(h / 24)} дн назад`;
};
const when = iso => new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const RANKS = ["", "Herald", "Guardian", "Crusader", "Archon", "Legend", "Ancient", "Divine", "Immortal"];

let DATA = null;

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    render(DATA);
  } catch (e) {
    if (!DATA) $("#app").innerHTML = `<div class="wrap err">Не удалось загрузить data.json (${esc(e.message)}). Попробую ещё раз через минуту.</div>`;
    setTimeout(load, 60000);
  }
}

function tickLive() {
  if (!DATA) return;
  const age = (Date.now() - new Date(DATA.updated_at)) / 60000;
  $("#upd").textContent = `Обновлено ${ago(DATA.updated_at)}`;
  $("#live").classList.toggle("stale", age > 40);
  const left = Math.max(0, Math.ceil(15 - (age % 15)));
  $("#next").textContent = age > 40 ? "сборщик давно не отвечал" : `следующий сбор ~через ${left} мин`;
}

function render(d) {
  const p = d.profile || {};
  if (p.avatar) $("#ava").src = p.avatar;
  $("#nick").textContent = p.name ? `· «${p.name}»` : "";
  tickLive();

  const ms = d.matches;
  const days = d.days;
  const today = days[days.length - 1];
  const todayDelta = today ? d.step * (today.w - today.l) : 0;
  const weekAgo = days.length > 7 ? days[days.length - 8].mmr : d.anchor.mmr;
  const wins = ms.filter(m => m.win).length;
  const losses = ms.length - wins;

  // серия с конца
  let streak = 0;
  for (const m of ms) { if (m.win === ms[0]?.win) streak++; else break; }

  // герои в выборке
  const hs = {};
  for (const m of ms) {
    const h = hs[m.hero] ||= { name: m.hero, img: m.hero_img, n: 0, w: 0 };
    h.n++; if (m.win) h.w++;
  }
  const heroes = Object.values(hs).sort((a, b) => b.n - a.n);

  const tier = p.rank_tier ? RANKS[Math.floor(p.rank_tier / 10)] : "";

  $("#app").innerHTML = `
  <section>
    <div class="wrap">
      <div class="score">
        <div class="card mmr-card">
          <div class="lbl">Примерный рейтинг сейчас</div>
          <div class="mmr-line">
            <div class="mmr num"><small>≈</small>${fmt(d.mmr)}</div>
            <div class="rank">${tier ? `<div><b>${tier}</b>${p.leaderboard_rank ? `<br>#${fmt(p.leaderboard_rank)} в лидерборде` : ""}</div>` : ""}</div>
          </div>
          <div class="deltas">
            <div class="delta"><div class="v num ${todayDelta >= 0 ? "w" : "l"}">${sign(todayDelta)}</div><div class="s">сегодня${today ? ` · ${today.w}-${today.l}` : ""}</div></div>
            <div class="delta"><div class="v num ${d.mmr - weekAgo >= 0 ? "w" : "l"}">${sign(d.mmr - weekAgo)}</div><div class="s">за 7 дней</div></div>
            <div class="delta"><div class="v num ${d.mmr - d.base.mmr >= 0 ? "w" : "l"}">${sign(d.mmr - d.base.mmr)}</div><div class="s">с ${dShort(d.base.date)} (${fmt(d.base.mmr)})</div></div>
          </div>
        </div>
        <div class="card form-card">
          <div class="lbl">Последние ${ms.length} матчей</div>
          <div class="wr-line">
            <div class="wr num ${wins >= losses ? "w" : "l"}">${ms.length ? Math.round(wins / ms.length * 100) : 0}%</div>
            <div class="wl num"><span class="w">${wins}W</span> – <span class="l">${losses}L</span></div>
          </div>
          <div class="strip" aria-label="Победы и поражения, слева старые">
            ${Array.from({ length: 20 }, (_, i) => {
              const m = ms[19 - i];
              return m ? `<i class="${m.win ? "w" : ""}" title="${esc(m.hero)} · ${m.win ? "победа" : "поражение"} · ${when(m.start)}"></i>` : `<i class="e" title="ещё не собран"></i>`;
            }).join("")}
          </div>
          <div class="cap"><span>← старые</span><span class="streak">${ms.length ? `Серия: <b class="${ms[0].win ? "w" : "l"}">${streak} ${ms[0].win ? "побед" : "поражений"} подряд</b>` : ""}</span><span>новые →</span></div>
          <div class="heroes">
            ${heroes.map(h => `<div class="hchip"><img src="${esc(h.img)}" alt=""><div><b>${esc(h.name)}</b><span class="num">${h.n} игр · ${h.w}-${h.n - h.w} · ${Math.round(h.w / h.n * 100)}%</span></div></div>`).join("")}
          </div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="sh">
        <h2>Рейтинг по дням</h2>
        <p>Старт ${fmt(d.base.mmr)} на ${dShort(d.base.date)}, дальше ±${d.step} за игру. До ${dShort(d.anchor.date)} считано по OpenDota, после — по календарю Dotabuff.</p>
      </div>
      <div class="card chart">
        <div class="sc"><div id="dayChart"></div></div>
        <div class="legend"><span><i></i>по дням, Dotabuff</span><span><i class="d"></i>${dShort(d.base.date)}–${dShort(d.anchor.date)}, OpenDota (итог 93W–99L)</span></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="sh">
        <h2>Последние ${ms.length} матчей</h2>
        <p>Рейтинг после каждой игры — откат от текущего значения на ±${d.step}. Наведите на точку, чтобы увидеть матч.</p>
      </div>
      <div class="card chart">
        <div class="sc"><div id="matchChart"></div></div>
        <div class="legend"><span><i class="b" style="background:var(--win)"></i>победа</span><span><i class="b" style="background:var(--loss)"></i>поражение</span><span><i></i>рейтинг после игры</span></div>
      </div>
      <div class="hist-wrap">
        <table class="h">
          <thead><tr><th>Герой</th><th>Результат</th><th>Длительность</th><th>KDA</th><th class="c">NW · GPM</th><th>Предметы</th><th class="c">Рейтинг</th></tr></thead>
          <tbody>
            ${ms.map(m => `
            <tr class="${m.win ? "win" : "loss"}">
              <td><div class="hero"><img src="${esc(m.hero_img)}" alt="" loading="lazy"><div><b>${esc(m.hero)}</b><span>${m.side === "radiant" ? "Radiant" : m.side === "dire" ? "Dire" : ""}${m.level ? ` · ур. ${m.level}` : ""}</span></div></div></td>
              <td><span class="res ${m.win ? "w" : "l"}">${m.win ? "Победа" : "Поражение"}</span><a class="sub" href="https://www.dotabuff.com/matches/${m.id}" target="_blank" rel="noopener" title="${when(m.start)}">${ago(m.start)}</a></td>
              <td class="num">${dur(m.duration)}<div class="sub">${esc(m.type || "")}${m.score ? ` · счёт ${m.score[0]}:${m.score[1]}` : ""}</div></td>
              <td class="kda num"><b class="k">${m.k}</b> / <b class="l">${m.d}</b> / <b>${m.a}</b><div class="sub">KDA ${((m.k + m.a) / Math.max(1, m.d)).toFixed(1)}${m.lh != null ? ` · ${m.lh}/${m.dn}` : ""}</div></td>
              <td class="c num">${m.nw != null ? `<b>${(m.nw / 1000).toFixed(1)}k</b><div class="sub">${m.gpm} GPM</div>` : `<span class="sub">ждём OpenDota</span>`}</td>
              <td><div class="inv">${m.items.length ? m.items.map(i => i ? `<img src="${esc(i.img)}" alt="${esc(i.name)}" title="${esc(i.name)}" loading="lazy">` : `<span class="empty"></span>`).join("") + (m.neutral ? `<img class="nt" src="${esc(m.neutral.img)}" alt="${esc(m.neutral.name)}" title="${esc(m.neutral.name)}" loading="lazy">` : "") : `<span class="sub">—</span>`}</div></td>
              <td class="c num"><span class="mm">${fmt(m.mmr_after)}</span><span class="dl ${m.delta > 0 ? "w" : m.delta < 0 ? "l" : "m"}">${m.delta ? sign(m.delta) : "0"}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="note">
        <p><b>Как считается.</b> Рейтинг у игрока скрыт, поэтому он примерный: ${fmt(d.base.mmr)} на ${dShort(d.base.date)}, затем +${d.step} за победу и −${d.step} за поражение. С ${dShort(d.base.date)} по ${dShort(d.anchor.date)} — матчи из OpenDota (93W–99L → ${fmt(d.anchor.mmr)}). Позже OpenDota историю не отдаёт, поэтому дальше идёт дневной счёт из календаря Dotabuff.</p>
        <p><b>Откуда матчи.</b> Список последних игр — с главной страницы профиля Dotabuff, она обновляется раз в 15 минут. Предметы, NW и GPM берутся из OpenDota по ID матча и появляются через несколько минут после игры. Новые матчи копятся, так что на странице всегда последние 20.</p>
        <p><b>Погрешность.</b> Календарь Dotabuff показывает не все игры (за 16.09–09.10 там 157 игр, в OpenDota 192), поэтому реальный рейтинг может отличаться на пару сотен. Последнее успешное чтение Dotabuff: ${d.scraped_at ? when(d.scraped_at) : "—"}.</p>
      </div>
    </div>
  </section>`;

  drawDays(d);
  drawMatches(d);
}

const tip = $("#tip");
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("pointerenter", e => { tip.innerHTML = el.dataset.tip; tip.style.display = "block"; moveTip(e); });
    el.addEventListener("pointermove", moveTip);
    el.addEventListener("pointerleave", () => tip.style.display = "none");
  });
}
function moveTip(e) {
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px";
  tip.style.top = (e.clientY - tip.offsetHeight - 12) + "px";
}

function niceRange(vals, pad) {
  const lo = Math.floor((Math.min(...vals) - pad) / 50) * 50;
  const hi = Math.ceil((Math.max(...vals) + pad) / 50) * 50;
  return [lo, hi];
}

function drawDays(d) {
  const el = $("#dayChart");
  const W = 1000, H = 300, L = 48, R = 16, T = 24, B = 30;
  const DAY = 86400000;
  const t0 = new Date(d.base.date + "T00:00:00").getTime();
  const pts = [{ date: d.base.date, mmr: d.base.mmr, base: true }, { date: d.anchor.date, mmr: d.anchor.mmr, anchor: true }, ...d.days];
  const tEnd = new Date(pts[pts.length - 1].date + "T00:00:00").getTime();
  const [lo, hi] = niceRange(pts.map(p => p.mmr), 40);
  const x = date => L + (new Date(date + "T00:00:00").getTime() - t0) / Math.max(DAY, tEnd - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const step = (hi - lo) / 50 > 8 ? 100 : 50;
  let g = "";
  for (let v = lo; v <= hi; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  // подписи дат раз в неделю
  for (let t = t0; t <= tEnd; t += 7 * DAY) {
    const iso = new Date(t).toISOString().slice(0, 10);
    const dd = new Date(t);
    g += `<text x="${x(iso)}" y="${H - 8}" text-anchor="middle">${String(dd.getDate()).padStart(2, "0")}.${String(dd.getMonth() + 1).padStart(2, "0")}</text>`;
  }
  const solid = [pts[1], ...d.days];
  const line = solid.map((p, i) => `${i ? "L" : "M"}${x(p.date).toFixed(1)},${y(p.mmr).toFixed(1)}`).join("");
  const area = line + `L${x(solid[solid.length - 1].date)},${H - B}L${x(solid[0].date)},${H - B}Z`;
  const last = solid[solid.length - 1];
  const baseY = y(d.base.mmr);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Рейтинг по дням">
    <defs><linearGradient id="gArea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3ae45" stop-opacity=".22"/><stop offset="1" stop-color="#e3ae45" stop-opacity="0"/></linearGradient></defs>
    ${g}
    <line x1="${L}" x2="${W - R}" y1="${baseY}" y2="${baseY}" stroke="#8a93a0" stroke-dasharray="2 4" opacity=".6"/>
    <text x="${W - R}" y="${baseY - 6}" text-anchor="end">старт ${d.base.mmr}</text>
    <path class="area" d="${area}"/>
    <path class="dash" d="M${x(d.base.date)},${y(d.base.mmr)}L${x(d.anchor.date)},${y(d.anchor.mmr)}"/>
    <path class="lineGold" d="${line}"/>
    ${pts.map(p => {
      const tipTxt = p.base ? `<b>${p.mmr}</b><br>${dShort(p.date)} · стартовая точка` : p.anchor ? `<b>${p.mmr}</b><br>${dShort(p.date)} · итог по OpenDota` : `<b>${p.mmr}</b><br>${dShort(p.date)} · <span class="w">${p.w}W</span>–<span class="l">${p.l}L</span> · ${sign(25 * (p.w - p.l))}`;
      return `<circle class="pt" cx="${x(p.date)}" cy="${y(p.mmr)}" r="${p === last ? 5 : 3}"/><circle class="hit" cx="${x(p.date)}" cy="${y(p.mmr)}" r="11" data-tip="${esc(tipTxt)}"/>`;
    }).join("")}
    <text class="lbl-v" x="${x(last.date) - 8}" y="${y(last.mmr) - 12}" text-anchor="end">≈${last.mmr}</text>
  </svg>`;
  bindTips(el);
}

function drawMatches(d) {
  const el = $("#matchChart");
  const ms = [...d.matches].reverse();
  if (!ms.length) { el.innerHTML = ""; return; }
  const W = 1000, H = 260, L = 48, R = 16, T = 24, B = 64;
  const vals = ms.flatMap(m => [m.mmr_after, m.mmr_after - m.delta]);
  const [lo, hi] = niceRange(vals, 20);
  const n = ms.length;
  const cw = (W - L - R) / n;
  const cx = i => L + cw * (i + .5);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi; v += 50) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const line = ms.map((m, i) => `${i ? "L" : "M"}${cx(i).toFixed(1)},${y(m.mmr_after).toFixed(1)}`).join("");
  const iw = Math.min(40, cw - 6), ih = iw * 0.5625;
  const bars = ms.map((m, i) => {
    const y0 = y(m.mmr_after - m.delta), y1 = y(m.mmr_after);
    const top = Math.min(y0, y1), h = Math.max(2, Math.abs(y1 - y0));
    const col = m.win ? "#5cbf75" : "#d65c58";
    const tipTxt = `<b class="${m.win ? "w" : "l"}">${m.win ? "Победа" : "Поражение"}</b> · ${esc(m.hero)}<br>${when(m.start)} · ${dur(m.duration)}<br>${m.k}/${m.d}/${m.a}${m.nw ? ` · NW ${(m.nw / 1000).toFixed(1)}k` : ""}<br>рейтинг ${m.mmr_after} (${sign(m.delta)})`;
    return `<rect x="${cx(i) - Math.min(10, cw / 3)}" y="${top}" width="${Math.min(20, cw / 1.5)}" height="${h}" rx="2" fill="${col}" opacity=".75"/>
      <image href="${esc(m.hero_img)}" x="${cx(i) - iw / 2}" y="${H - B + 14}" width="${iw}" height="${ih}" preserveAspectRatio="xMidYMid slice"/>
      <rect x="${cx(i) - iw / 2}" y="${H - B + 14 + ih + 3}" width="${iw}" height="3" rx="1.5" fill="${col}"/>
      <rect class="hit" x="${cx(i) - cw / 2}" y="${T}" width="${cw}" height="${H - T}" data-tip="${esc(tipTxt)}"/>`;
  }).join("");
  const last = ms[n - 1];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Рейтинг по последним матчам">
    ${g}${bars}
    <path class="lineGold" d="${line}" pointer-events="none"/>
    ${ms.map((m, i) => `<circle class="pt" cx="${cx(i)}" cy="${y(m.mmr_after)}" r="${i === n - 1 ? 5 : 3}" pointer-events="none"/>`).join("")}
    <text class="lbl-v" x="${cx(n - 1)}" y="${y(last.mmr_after) - 12}" text-anchor="end">≈${last.mmr_after}</text>
  </svg>`;
  bindTips(el);
}

load();
setInterval(load, 5 * 60000);
setInterval(tickLive, 30000);
</script>
