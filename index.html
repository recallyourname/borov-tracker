<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const FONT_H = '"Sofia Sans Extra Condensed", "Arial Narrow", system-ui, sans-serif';
  const FONT_B = 'Inter, "Segoe UI", system-ui, sans-serif';
  const OUT = "#22121a";
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  // Высота мира постоянна, ширина подстраивается под экран
  const H = 330, FLOOR = 268, PIG_X = 92, PIG_S = .8, FEET = 22;
  const GRAV = 2500, JUMP = 790, CUT = 480, DROP = 3800, AIR = 2 * JUMP / GRAV, FALL = .68;
  const SPEED0 = 340, SPEED_GAIN = 430, SPEED_K = 1200;
  const LEVELS = [
    { at: 0, name: "Чат открыт" },
    { at: 100, name: "Предупреждение" },
    { at: 240, name: "Мут на 10 минут" },
    { at: 420, name: "Мут на сутки" },
    { at: 640, name: "Теневой бан" },
    { at: 900, name: "Бан на месяц" },
    { at: 1250, name: "Перманентный бан" },
  ];
  const CAUSE = { rad: "сгорел об Радианс", viper: "укушен Вайпером", poison: "отравлен Вайпером" };
  const sk = { a: "#ffc0cb", b: "#e87f9c", snout: "#ffa3b5", hoof: "#6d3a48", ear: "#e36f8f", nost: "#7b3a4b", blush: "#ff6f8e", eye: "#20141a" };

  /* ───────── Поросёнок ───────── */
  function fillStroke(c, fill) { c.fillStyle = fill; c.fill(); c.stroke(); }
  function ell(c, x, y, rx, ry) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function vGrad(c, y0, y1, a, b) { const g = c.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
  function leg(c, x, y, ang) {
    c.save(); c.translate(x, y); c.rotate(ang);
    c.beginPath(); c.roundRect(-4.6, 0, 9.2, 13, 3.5); fillStroke(c, sk.b);
    c.beginPath(); c.roundRect(-4.6, 8.5, 9.2, 4.5, 2); fillStroke(c, sk.hoof);
    c.restore();
  }
  function earShape(c, px, py, ang) {

  function curl(c) {

    path(); c.strokeStyle = sk.b; c.lineWidth = 2.8; c.stroke();
    c.strokeStyle = OUT; c.lineWidth = 2.6;
  }
  function pigFace(c, face) {
    const ex = 19, ey = -12;
    c.strokeStyle = OUT; c.lineWidth = 2.2;
    if (face === "dead") {
      c.beginPath(); c.moveTo(ex - 3.5, ey - 3.5); c.lineTo(ex + 3.5, ey + 3.5); c.moveTo(ex + 3.5, ey - 3.5); c.lineTo(ex - 3.5, ey + 3.5); c.stroke();

    } else if (face === "wide") {
      c.beginPath(); c.arc(ex, ey, 5.8, 0, 7); fillStroke(c, "#fff");
      c.fillStyle = sk.eye; c.beginPath(); c.arc(ex + 2, ey - .8, 2, 0, 7); c.fill();
      ell(c, 22, 4, 3.6, 3.1); fillStroke(c, "#6d2436");
    } else {
      c.beginPath(); c.arc(ex, ey, 4.9, 0, 7); fillStroke(c, "#fff");
      c.fillStyle = sk.eye; c.beginPath(); c.arc(ex + 1.6, ey, 2.7, 0, 7); c.fill();
      c.fillStyle = "#fff"; c.beginPath(); c.arc(ex + 2.6, ey - 1.2, .9, 0, 7); c.fill();
      c.beginPath(); c.arc(21, 1.5, 3.8, Math.PI * .2, Math.PI * .85); c.stroke();
    }
    c.strokeStyle = OUT; c.lineWidth = 2.6;
  }
  function pigSide(c, x, y, s, rot, legs, ear, face) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
    c.lineJoin = "round"; c.lineCap = "round"; c.strokeStyle = OUT; c.lineWidth = 2.6;
    curl(c);
    leg(c, -6, 13, legs * .9 + .1);
    leg(c, 13, 12, legs * .9 + .1);
    ell(c, -2, 3, 24, 19); fillStroke(c, vGrad(c, -16, 22, sk.a, sk.b));
    c.save(); c.globalAlpha = .28; ell(c, -7, -7, 12, 6); c.fillStyle = "#fff"; c.fill(); c.restore();
    leg(c, -14, 14, -legs + .05);
    leg(c, 5, 15, -legs);
    earShape(c, 21, -19, .35 + ear * .5);
    c.beginPath(); c.arc(15, -7, 15.5, 0, Math.PI * 2); fillStroke(c, vGrad(c, -22, 9, sk.a, sk.b));
    earShape(c, 8, -19, -.3 - ear * .75);
    c.save(); c.globalAlpha = .5; ell(c, 13, -1, 4.2, 3); c.fillStyle = sk.blush; c.fill(); c.restore();
    ell(c, 29, -4, 8.6, 7.2); fillStroke(c, sk.snout);
    c.fillStyle = sk.nost; ell(c, 26.5, -5, 1.4, 2.3); c.fill(); ell(c, 31.5, -5, 1.4, 2.3); c.fill();
    pigFace(c, face);
    c.restore();
  }

  /* ───────── Радианс, воткнутый в землю ───────── */
  const BLADE = 30, GUARD = 50, HILT = 72;
  function bladeFill(c) {
    const g = c.createLinearGradient(-BLADE, 0, BLADE, 0);
    [[0, "#6a350a"], [.16, "#d98a1e"], [.4, "#ffe39a"], [.5, "#fff4cf"], [.6, "#ffd87a"], [.84, "#c9761a"], [1, "#6a350a"]].forEach(s => g.addColorStop(s[0], s[1]));
    return g;
  }
  function paintRad(c, len) {
    c.lineJoin = "round"; c.strokeStyle = OUT; c.lineWidth = 3;
    c.beginPath(); c.rect(-BLADE, HILT - 4, BLADE * 2, len); c.fillStyle = bladeFill(c); c.fill(); c.stroke();
    c.fillStyle = "#a35a10"; c.fillRect(-5, HILT, 10, len);
    for (let y = HILT + 26; y < HILT + len - 14; y += 56) {
      c.fillStyle = "#fff5c8"; c.beginPath(); c.moveTo(0, y - 11); c.lineTo(6, y); c.lineTo(0, y + 11); c.lineTo(-6, y); c.closePath(); c.fill();
      c.fillStyle = "#e0761a"; c.beginPath(); c.moveTo(0, y - 5); c.lineTo(3, y); c.lineTo(0, y + 5); c.lineTo(-3, y); c.closePath(); c.fill();
    }
    c.beginPath(); c.roundRect(-10, 24, 20, 30, 3); c.fillStyle = "#3b1f14"; c.fill(); c.stroke();
    c.strokeStyle = "#8a5a2a"; c.lineWidth = 2;
    for (let y = 30; y < 52; y += 6) { c.beginPath(); c.moveTo(-9, y + 2); c.lineTo(9, y - 2); c.stroke(); }
    c.strokeStyle = OUT; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-GUARD, 49); c.quadraticCurveTo(-26, 60, -10, 52); c.lineTo(10, 52); c.quadraticCurveTo(26, 60, GUARD, 49);
    c.quadraticCurveTo(46, 66, 32, 70); c.quadraticCurveTo(14, 74, 0, 72); c.quadraticCurveTo(-14, 74, -32, 70); c.quadraticCurveTo(-46, 66, -GUARD, 49); c.closePath();
    c.fillStyle = vGrad(c, 48, 74, "#ffe39a", "#b2661a"); c.fill(); c.stroke();
    ell(c, 0, 62, 6.4, 6.4); c.fillStyle = "#d13b2a"; c.fill(); c.stroke();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      c.beginPath(); c.moveTo(Math.cos(a - .28) * 11, 14 + Math.sin(a - .28) * 11); c.lineTo(Math.cos(a) * 19, 14 + Math.sin(a) * 19); c.lineTo(Math.cos(a + .28) * 11, 14 + Math.sin(a + .28) * 11); c.closePath();
      c.fillStyle = "#f2a22e"; c.fill();
    }
    ell(c, 0, 14, 12.5, 12.5); c.fillStyle = vGrad(c, 2, 26, "#fff0b5", "#d17a1c"); c.fill(); c.stroke();
    ell(c, 0, 14, 5.4, 5.4); c.fillStyle = "#d13b2a"; c.fill(); c.lineWidth = 2; c.stroke();
  }
  function sprite(w, h, paint) {
    const cv = document.createElement("canvas"); cv.width = w * 2; cv.height = h * 2;
    const c = cv.getContext("2d"); c.scale(2, 2); paint(c); return cv;
  }
  const SP_RAD = sprite(160, 360, c => { c.translate(80, 20); paintRad(c, 330); });
  function flames(c, y0, y1, half, t) {
    const pass = (k, fill) => {
      c.beginPath();
      for (let y = y0 + 8; y < y1; y += 28) for (const sd of [-1, 1]) {
        const ph = y * .17 + sd * 1.7, h = (11 + 7 * Math.sin(t * 6 + ph)) * k, xb = sd * half, sw = 3 * Math.sin(t * 9 + ph);
        c.moveTo(xb, y + 9 * k);
        c.quadraticCurveTo(xb + sd * h, y + 3, xb + sd * h * .55 + sw, y - 12 * k - h * .8);
        c.quadraticCurveTo(xb + sd, y - 6, xb, y - 9 * k);
        c.closePath();
      }
      c.fillStyle = fill; c.fill();
    };
    c.save(); c.globalCompositeOperation = "lighter";
    pass(1, "rgba(255,120,24,.72)"); pass(.55, "rgba(255,215,110,.85)");
    c.restore();
  }
  function drawRad(c, o, t) {
    const s = o.s, pulse = .3 + .08 * Math.sin(t * 3 + o.x * .01);
    c.save(); c.translate(o.x, o.e); c.scale(s, s);
    const r = 150, g = c.createRadialGradient(0, 40, 4, 0, 40, r);
    g.addColorStop(0, `rgba(255,170,60,${pulse})`); g.addColorStop(1, "rgba(255,110,20,0)");
    c.save(); c.globalCompositeOperation = "lighter"; c.fillStyle = g; c.fillRect(-r, 40 - r, r * 2, r * 2); c.restore();
    c.drawImage(SP_RAD, -80, -20, 160, 360);
    flames(c, HILT + 4, (FLOOR - o.e) / s, BLADE, t);
    c.restore();
  }

  /* ───────── Вайпер ───────── */
  function wing(c, f, far) {
    const up = -f;
    const tx = 20, ty = -8 + up * 46, ex = -4, ey = -10 + up * 26;
    c.beginPath(); c.moveTo(-12, -6);
    c.quadraticCurveTo(ex - 10, ey - 4, ex, ey);
    c.lineTo(tx, ty);
    c.quadraticCurveTo(tx - 2, (ty + 4) / 2 + 6, 16, 4 + up * 8);
    c.quadraticCurveTo(10, up * 12 + 2, 6, 6 + up * 4);
    c.quadraticCurveTo(0, up * 6 + 4, -10, 6);
    c.closePath();
    fillStroke(c, far ? "#2c6b2f" : vGrad(c, Math.min(ty, 6), Math.max(ty, 8), "#a6dc52", "#3f9136"));
    c.save(); c.strokeStyle = far ? "#1c4a22" : "#2f7430"; c.lineWidth = 1.8;
    c.beginPath(); c.moveTo(ex, ey); c.lineTo(16, 4 + up * 8); c.moveTo(ex, ey); c.lineTo(6, 6 + up * 4); c.stroke();
    c.restore();
  }
  function drawViper(c, x, y, s, t, angry) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.lineJoin = "round"; c.lineCap = "round"; c.strokeStyle = OUT; c.lineWidth = 2.6;
    const f = Math.sin(t * (angry ? 13 : 8) + x * .015), sw = Math.sin(t * 6 + x * .01) * 5;
    c.save(); c.translate(8, -4); wing(c, f, true); c.restore();

    c.beginPath(); c.moveTo(12, -11);
    c.bezierCurveTo(34, -14 + sw, 46, 6 - sw, 68, -2 + sw);
    c.lineTo(84, -8 + sw); c.lineTo(78, 4 + sw); c.lineTo(84, 12 + sw); c.lineTo(68, 6 + sw);
    c.bezierCurveTo(48, 14 - sw, 34, 6 + sw, 10, 11);
    c.closePath(); fillStroke(c, vGrad(c, -14, 14, "#7cc544", "#23682e"));
    // тело
    ell(c, 0, 0, 22, 14); fillStroke(c, vGrad(c, -14, 14, "#8ad04a", "#2c7a33"));
    c.save(); c.globalAlpha = .55; ell(c, -2, 7, 14, 5); c.fillStyle = "#e8e27a"; c.fill(); c.restore();
    // шея и голова
    c.beginPath(); c.moveTo(-12, -11); c.quadraticCurveTo(-26, -14, -36, -16); c.lineTo(-34, 0); c.quadraticCurveTo(-24, 2, -12, 11); c.closePath();
    fillStroke(c, vGrad(c, -16, 10, "#84cc48", "#2c7a33"));
    c.beginPath(); c.moveTo(-34, -21); c.lineTo(-21, -35); c.lineTo(-27, -18); c.closePath(); fillStroke(c, "#e8d36a");
    c.beginPath(); c.moveTo(-40, -22); c.lineTo(-33, -38); c.lineTo(-33, -21); c.closePath(); fillStroke(c, "#d8bf52");
    c.beginPath(); c.moveTo(-26, -20); c.quadraticCurveTo(-42, -28, -54, -14); c.lineTo(-68, -8); c.lineTo(-52, -5); c.quadraticCurveTo(-40, -3, -28, 0); c.closePath();
    fillStroke(c, vGrad(c, -26, 0, "#9ad94f", "#3a8a38"));
    c.beginPath(); c.moveTo(-30, 0); c.lineTo(-58, 4); c.quadraticCurveTo(-44, 9, -28, 6); c.closePath(); fillStroke(c, "#3a8a38");
    c.beginPath(); c.moveTo(-53, -5); c.lineTo(-50, 0); c.lineTo(-47, -4); c.closePath(); c.fillStyle = "#fff7da"; c.fill();
    c.beginPath(); c.moveTo(-43, -3); c.lineTo(-40, 2); c.lineTo(-37, -2); c.closePath(); c.fillStyle = "#fff7da"; c.fill();
    ell(c, -38, -15, 5, 3.8); fillStroke(c, angry ? "#ff5a3a" : "#ffe14d");
    c.fillStyle = "#17110a"; ell(c, -39, -15, 1.3, 3.2); c.fill();
    // ядовитая слюна
    const d = (t * 1.6 + x * .003) % 1;
    c.save(); c.globalAlpha = 1 - d; c.fillStyle = "#b5f04a"; ell(c, -54, 6 + d * 16, 2.1, 3.1); c.fill(); c.restore();
    c.save(); c.translate(0, -2); wing(c, f, false); c.restore();
    c.restore();
  }
  function drawOrb(c, o, t) {
    c.save(); c.globalCompositeOperation = "lighter";
    const g = c.createRadialGradient(o.x, o.y, 1, o.x, o.y, 24);
    g.addColorStop(0, "rgba(170,255,70,.75)"); g.addColorStop(1, "rgba(80,200,40,0)");
    c.fillStyle = g; c.fillRect(o.x - 24, o.y - 24, 48, 48); c.restore();
    c.save(); c.lineWidth = 2.2; c.strokeStyle = OUT;
    c.beginPath(); c.moveTo(o.x, o.y - 15 - Math.sin(t * 20) * 2); c.quadraticCurveTo(o.x + 10, o.y - 2, o.x, o.y + 9); c.quadraticCurveTo(o.x - 10, o.y - 2, o.x, o.y - 15 - Math.sin(t * 20) * 2); c.closePath();
    fillStroke(c, vGrad(c, o.y - 15, o.y + 9, "#d9ff7a", "#57b02c")); c.restore();
  }
  function drawPuddle(c, o, t) {
    c.save(); c.lineWidth = 2.2; c.strokeStyle = OUT; ell(c, o.x, FLOOR + 1, o.w / 2, 7);

    c.fillStyle = "#e6ff9b";
    for (let i = 0; i < 3; i++) {
      const p = (t * 1.5 + i * .37 + o.x * .002) % 1;
      ell(c, o.x - 13 + i * 13, FLOOR - 2 - p * 14, 3 * (1 - p) + .6, 3 * (1 - p) + .6); c.fill();
    }
    c.restore();
  }

  /* ───────── Окружение ───────── */
  let seed = 7; const srnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const SP_STARS = sprite(1400, 210, c => {
    for (let i = 0; i < 150; i++) { c.globalAlpha = .2 + srnd() * .6; c.fillStyle = "#cfe3ff"; c.beginPath(); c.arc(srnd() * 1400, srnd() * 210, .5 + srnd() * .9, 0, 7); c.fill(); }
  });
  function ridge(c, base, a1, a2, a3, ph, fill) {
    const P = Math.PI * 2 / 800;
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= 800; x += 4) c.lineTo(x, base + a1 * Math.sin(P * x + ph) + a2 * Math.sin(P * x * 3 + ph * 2) + a3 * Math.sin(P * x * 8 + ph * 3));
    c.lineTo(800, H); c.closePath(); c.fillStyle = fill; c.fill();
  }
  const SP_FAR = sprite(800, H, c => ridge(c, 190, 26, 16, 5, 1.1, "#222033"));
  const SP_NEAR = sprite(800, H, c => {
    ridge(c, 228, 12, 8, 4, 2.4, "#161a26");
    c.fillStyle = "#10141c";
    for (let i = 0; i < 44; i++) {
      const x = i * 800 / 44 + 4, h = 20 + ((i * 37) % 19) * 1.3, by = 244 + 6 * Math.sin(i * 1.3);
      c.beginPath(); c.moveTo(x - 10, by + 6); c.lineTo(x, by - h); c.lineTo(x + 10, by + 6); c.closePath(); c.fill();
    }
    c.fillRect(0, 248, 800, H - 248);
  });
  function drawBack(c, off, tint) {
    const g = c.createLinearGradient(0, 0, 0, FLOOR);
    [[0, "#0c1118"], [.55, "#17182a"], [.82, "#33232a"], [1, "#6a3a1e"]].forEach(s => g.addColorStop(s[0], s[1]));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.drawImage(SP_STARS, -((off * .04) % 700), 0, 1400, 210);
    if (W > 700) c.drawImage(SP_STARS, 1400 - ((off * .04) % 700), 0, 1400, 210);
    if (tint > .005) { c.fillStyle = `rgba(190,24,40,${tint * .34})`; c.fillRect(0, 0, W, FLOOR); }
  }
  function drawRidges(c, off) {
    for (const [sp, k] of [[SP_FAR, .15], [SP_NEAR, .4]]) {
      let x = -((off * k) % 800);
      for (; x < W; x += 800) c.drawImage(sp, x, 0, 800, H);
    }
  }
  function drawGround(c, off) {
    const y = FLOOR, h = H - FLOOR;
    c.fillStyle = "#171d22"; c.fillRect(0, y, W, h);
    c.fillStyle = "#3e5a3a"; c.fillRect(0, y, W, 7);
    c.fillStyle = "#62863f"; c.fillRect(0, y, W, 3);
    c.fillStyle = "#222a31";
    const step = 56, dx = -(off % step);
    for (let i = -1; i * step + dx < W; i++) {
      const X = i * step + dx;
      c.beginPath(); c.roundRect(X + 4, y + 14, step - 10, 16, 4); c.fill();
      c.beginPath(); c.roundRect(X + 4 + step / 2, y + 36, step - 10, 16, 4); c.fill();
    }
  }

  /* ───────── Логика ───────── */
  const cv = $("#game"), ctx = cv.getContext("2d");
  let W = 800, k = 1, wScale = 1;
  function fit() {
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const d = Math.min(devicePixelRatio || 1, 2.5);
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
    k = cv.height / H; W = cv.width / k;
    wScale = clamp(W / 800, .55, 1);
  }
  new ResizeObserver(fit).observe(cv);
  fit();

  const store = { get(n, d) { try { return localStorage.getItem(n) ?? d; } catch { return d; } }, set(n, v) { try { localStorage.setItem(n, v); } catch {} } };
  let best = +store.get("borovRunBest", 0) || 0;
  let soundOn = store.get("pigSound", "1") === "1";
  let st;

  function newSky() { return { x: W + 80, y: rand(30, 64), s: rand(.42, .6), v: rand(70, 130) }; }
  function reset() {
    st = {
      mode: "ready", t: 0, off: 0, score: 0, lvl: 0, tint: 0, h: 0, v: 0, held: false, duckHeld: false, duck: false, buf: 0, run: 0,
      next: 500, skyT: 2, deadT: 0, shake: 0, flash: 0, cause: "", record: false, banner: 0,
      obs: [], parts: [], sky: [{ x: W * .52, y: 42, s: .56, v: 90 }, { x: W * .86, y: 62, s: .46, v: 75 }],
    };
  }
  reset();

  let ac;
  function tone(f0, f1, d, type, g) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const o = ac.createOscillator(), a = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
      a.gain.setValueAtTime(g, t); a.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(a).connect(ac.destination); o.start(t); o.stop(t + d);
    } catch {}
  }
  const speed = () => (SPEED0 + SPEED_GAIN * (1 - Math.exp(-st.score / SPEED_K))) * wScale;
  function puff(x, y, n, col, sp) {
    if (REDUCED) n = Math.min(n, 3);
    for (let i = 0; i < n; i++) st.parts.push({ x, y, vx: rand(-sp, sp), vy: rand(-sp, sp * .2), life: rand(.3, .6), col });
  }
  function doJump() { st.v = JUMP; st.h = .01; st.buf = 0; st.duck = false; tone(420, 180, .13, "square", .05); puff(PIG_X - 14, FLOOR - 3, 4, "#c9c2b8", 60); }
  function press() {
    if (st.mode === "dead") { if (st.deadT > .4) { reset(); st.mode = "run"; st.held = true; doJump(); } return; }
    if (st.mode === "paused") { st.mode = "run"; return; }
    if (st.mode === "ready") st.mode = "run";
    st.held = true;
    if (st.h <= 0) doJump(); else st.buf = .11;
  }
  function release() { st.held = false; if (st.mode === "run" && st.v > CUT) st.v = CUT; }
  function setDuck(on) { st.duckHeld = on; if (on && st.mode === "ready") st.mode = "run"; }

  // Сколько секунд прыжок держит ноги выше препятствия высотой h
  function clearTime(h) { const d = JUMP * JUMP - 2 * GRAV * Math.max(0, h - 3); return d > 0 ? 2 * Math.sqrt(d) / GRAV : 0; }
  function spawn(v) {
    const L = st.lvl, r = Math.random(), x = W + 90;
    if (L >= 4 && r < .2) { st.obs.push({ k: "dropper", x, y: rand(46, 62), s: .72, dv: 30, dropped: false }); return 70; }
    if (L >= 2 && r < (L >= 4 ? .52 : .34)) {
      const high = L >= 3 && Math.random() < .4;
      st.obs.push({ k: "viper", x, y: FLOOR - (high ? 104 : 48), s: .8, dv: rand(20, 50) });
      return 100;
    }
    let n = 1 + Math.floor(Math.random() * (L < 1 ? 1 : L < 3 ? 2 : L < 5 ? 3 : 4));
    const s = rand(.46, .6), step = 88 * s * .82;
    const hs = Array.from({ length: 4 }, () => HILT * s + rand(14, 40));
    const width = m => (m - 1) * step + 88 * s;
    const tallest = m => Math.max(...hs.slice(0, m));
    while (n > 1 && width(n) + 34 > v * clearTime(tallest(n)) * .92) n--;
    for (let i = 0; i < n; i++) st.obs.push({ k: "rad", x: x + i * step, s, e: FLOOR - hs[i] });
    return width(n);
  }
  function circRect(cx, cy, r, x, y, w, h) { const dx = cx - clamp(cx, x, x + w), dy = cy - clamp(cy, y, y + h); return dx * dx + dy * dy < r * r; }
  function pigCircles() {
    if (st.duck) return [[PIG_X - 10, FLOOR - 11, 11], [PIG_X + 10, FLOOR - 12, 10]];
    const y = FLOOR - FEET - st.h;
    return [[PIG_X - 3, y + 3, 14], [PIG_X + 12, y - 6, 10]];
  }
  function hits(o, cs) {
    for (const [cx, cy, r] of cs) {
      if (o.k === "rad") {
        const s = o.s, e = o.e;
        if (circRect(cx, cy, r, o.x - 14 * s, e, 28 * s, 49 * s)) return true;
        if (circRect(cx, cy, r, o.x - 44 * s, e + 49 * s, 88 * s, 21 * s)) return true;
        if (circRect(cx, cy, r, o.x - BLADE * s, e + 70 * s, BLADE * 2 * s, FLOOR - e)) return true;
      } else if (o.k === "viper") {
        if (Math.hypot(cx - o.x, cy - o.y) < r + 18) return true;
        if (Math.hypot(cx - (o.x - 36), cy - (o.y - 9)) < r + 8) return true;
      } else if (o.k === "orb") {
        if (Math.hypot(cx - o.x, cy - o.y) < r + 7) return true;
      } else if (o.k === "puddle") {
        if (circRect(cx, cy, r, o.x - o.w / 2, FLOOR - 10, o.w, 10)) return true;
      }
    }
    return false;
  }
  function die(o) {
    st.mode = "dead"; st.deadT = 0; st.held = false; st.duck = false; st.duckHeld = false;
    st.cause = CAUSE[o.k === "rad" ? "rad" : o.k === "viper" ? "viper" : "poison"];
    st.shake = REDUCED ? 0 : 1; st.flash = 1;
    st.v = Math.max(st.v, 300);
    puff(PIG_X, FLOOR - FEET - st.h, 18, o.k === "rad" ? "#ff9b35" : "#a6e34f", 190);
    tone(260, 45, .5, "sawtooth", .09);
    const sc = Math.floor(st.score);
    if (sc > best) { best = sc; st.record = true; store.set("borovRunBest", best); }
  }
  function moveDecor(dt) {
    for (const b of st.sky) b.x -= b.v * dt;
    st.sky = st.sky.filter(b => b.x > -100);
    st.skyT -= dt;
    if (st.skyT <= 0) { st.sky.push(newSky()); st.skyT = rand(2.6, 5.4) / (1 + st.lvl * .2); }
  }
  function moveParts(dt) {
    for (const p of st.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; p.life -= dt; }
    st.parts = st.parts.filter(p => p.life > 0);
  }
  function step(dt) {
    st.t += dt; st.flash = Math.max(0, st.flash - dt * 3.5); st.shake = Math.max(0, st.shake - dt * 3); st.banner = Math.max(0, st.banner - dt);
    moveParts(dt);
    if (st.mode === "paused") return;
    if (st.mode === "dead") {
      st.deadT += dt;
      if (st.h > 0 || st.v > 0) { st.v -= GRAV * dt; st.h = Math.max(0, st.h + st.v * dt); if (st.h === 0) st.v = 0; }
      return;
    }
    if (st.mode === "ready") { if (!REDUCED) moveDecor(dt); return; }

    const v = speed();
    st.off += v * dt; st.run += v * dt * .045;
    st.score += v / wScale / 40 * dt;
    st.tint += (st.lvl / (LEVELS.length - 1) - st.tint) * Math.min(1, dt * 1.5);
    const nextLvl = st.lvl + 1;
    if (nextLvl < LEVELS.length && st.score >= LEVELS[nextLvl].at) { st.lvl = nextLvl; st.banner = 1.6; tone(330, 880, .28, "triangle", .08); }

    st.buf = Math.max(0, st.buf - dt);
    if (st.h > 0 || st.v > 0) {
      st.v -= (GRAV + (st.duckHeld ? DROP : 0)) * dt;
      st.h += st.v * dt;
      if (st.h <= 0) { st.h = 0; st.v = 0; puff(PIG_X - 10, FLOOR - 3, 3, "#c9c2b8", 40); if (st.buf > 0) doJump(); }
    }
    st.duck = st.duckHeld && st.h <= 0;

    moveDecor(dt);
    st.next -= v * dt;
    if (st.next <= 0) {
      const w = spawn(v), extra = rand(0, v * Math.max(.4, 1.05 - .1 * st.lvl));
      st.next = w + v * (AIR + .22) + extra;
    }
    const cs = pigCircles();
    for (const o of st.obs) {
      if (o.k === "orb") {
        o.vy += 900 * dt; o.y += o.vy * dt; o.x -= o.vx * dt;
        if (o.y >= FLOOR - 4) { o.k = "puddle"; o.w = 46; puff(o.x, FLOOR - 4, 7, "#b5f04a", 90); tone(190, 90, .1, "sine", .05); }
      } else o.x -= (v + (o.dv || 0)) * dt;
      if (o.k === "dropper" && !o.dropped && o.x <= Math.min(PIG_X + v * (FALL + .5), W - 20)) {
        // На узком экране капля летит медленнее мира, иначе упадёт вплотную к поросёнку
        const x0 = o.x - 36 * o.s, landX = PIG_X + v * .5;
        o.dropped = true; st.obs.push({ k: "orb", x: x0, y: o.y + 6, vy: 0, vx: clamp((x0 - landX) / FALL, 0, v) });
      }
      if (hits(o, cs)) { die(o); break; }
    }
    st.obs = st.obs.filter(o => o.x > -140);
  }

  /* ───────── Отрисовка ───────── */
  function text(c, s, x, y, font, col, align = "center") { c.font = font; c.textAlign = align; c.textBaseline = "middle"; c.fillStyle = col; c.fillText(s, x, y); }
  // Текст по центру, который уменьшается, если не влезает в ширину экрана
  function fitText(c, s, y, weight, size, family, col) {
    c.font = `${weight} ${size}px ${family}`;
    const w = c.measureText(s).width, max = W - 28;
    text(c, s, W / 2, y, `${weight} ${w > max ? Math.floor(size * max / w) : size}px ${family}`, col);
  }
  function drawPig(c) {
    const air = st.h > 0, t = st.run, dead = st.mode === "dead";
    const near = st.mode === "run" && st.obs.some(o => o.k !== "dropper" && o.x > PIG_X && o.x - PIG_X < 120 && (o.k !== "viper" || o.y > FLOOR - 70));
    const face = dead ? "dead" : near ? "wide" : "normal";
    const y = FLOOR - FEET - st.h;
    c.save(); c.globalAlpha = clamp(.3 - st.h / 400, .08, .3); ell(c, PIG_X, FLOOR + 3, 25 - st.h / 12, 4.5); c.fillStyle = "#000"; c.fill(); c.restore();
    if (st.duck) {
      c.save(); c.translate(PIG_X, FLOOR); c.scale(1.2, .6);
      pigSide(c, 0, -FEET, PIG_S, .05, Math.sin(t) * .7, .9, face);
      c.restore();
    } else if (dead) {
      pigSide(c, PIG_X, y, PIG_S, st.h > 0 ? -.3 + st.deadT * 5 : 1.5 * .95, .55, .8, face);
    } else {
      const legs = air ? .55 : st.mode === "run" ? Math.sin(t) * .7 : 0;
      pigSide(c, PIG_X, y, PIG_S, air ? clamp(-st.v / 1700, -.4, .4) : 0, legs, air ? .9 : Math.abs(Math.sin(t)) * .4, face);
    }
  }
  function drawHud(c) {
    const sc = Math.floor(st.score), lv = LEVELS[st.lvl];
    text(c, lv.name.toUpperCase(), 14, 22, `800 24px ${FONT_H}`, st.lvl === LEVELS.length - 1 ? "#ff6b70" : "#e3ae45", "left");
    text(c, String(sc).padStart(5, "0"), W - 14, 22, `800 28px ${FONT_H}`, "#eceef2", "right");
    if (best) text(c, `РЕКОРД ${best}`, W - 14, 44, `700 17px ${FONT_H}`, "#8d97a5", "right");
    if (st.banner > 0) {
      c.save(); c.globalAlpha = clamp(st.banner * 2, 0, 1);
      fitText(c, lv.name.toUpperCase(), 104, 800, 52, FONT_H, "#ff6b70");
      c.restore();
    }
  }
  function drawOver(c) {
    if (st.mode === "ready") {
      fitText(c, "ПОРОСЁНОК ПРОТИВ МОДЕРАЦИИ", 124, 800, 46, FONT_H, "#eceef2");
      text(c, matchMedia("(pointer: coarse)").matches ? "Нажми, чтобы бежать" : "Пробел или клик, чтобы бежать", W / 2, 162, `500 15px ${FONT_B}`, "#c6ccd6");
    } else if (st.mode === "paused") {
      c.fillStyle = "#06080bb0"; c.fillRect(0, 0, W, H);
      text(c, "ПАУЗА", W / 2, 130, `800 54px ${FONT_H}`, "#eceef2");
      text(c, "Нажми, чтобы продолжить", W / 2, 170, `500 15px ${FONT_B}`, "#c6ccd6");
    } else if (st.mode === "dead") {
      const a = clamp(st.deadT * 4, 0, 1);
      c.save(); c.globalAlpha = a;
      c.fillStyle = "#06080bb8"; c.fillRect(0, 0, W, H);
      c.save(); c.translate(W / 2, 96); c.rotate(-.035);
      c.font = `800 72px ${FONT_H}`; const tw = c.measureText("ЗАБАНЕН").width;
      c.strokeStyle = "#e5484d"; c.lineWidth = 4; c.beginPath(); c.roundRect(-tw / 2 - 20, -46, tw + 40, 88, 8); c.stroke();
      text(c, "ЗАБАНЕН", 0, -1, `800 72px ${FONT_H}`, "#e5484d");
      c.restore();
      text(c, `Причина: ${st.cause}`, W / 2, 168, `600 16px ${FONT_B}`, "#eceef2");
      const sc = Math.floor(st.score);
      text(c, st.record ? `Новый рекорд: ${sc}` : `Счёт ${sc}, рекорд ${best}`, W / 2, 196, `800 30px ${FONT_H}`, st.record ? "#e3ae45" : "#eceef2");
      fitText(c, `Апелляции не принимаются. ${matchMedia("(pointer: coarse)").matches ? "Нажми" : "Пробел"}, чтобы попробовать ещё раз`, 232, 500, 14, FONT_B, "#aeb6c2");
      c.restore();
    }
  }
  function draw() {
    const c = ctx, t = st.t;
    c.setTransform(k, 0, 0, k, 0, 0);
    c.save();
    if (st.shake > 0) c.translate(rand(-7, 7) * st.shake, rand(-5, 5) * st.shake);
    drawBack(c, st.off, st.tint);
    for (const b of st.sky) { c.save(); c.globalAlpha = .9; drawViper(c, b.x, b.y, b.s, t, false); c.restore(); }
    drawRidges(c, st.off);
    for (const o of st.obs) if (o.k === "rad") drawRad(c, o, t);
    drawGround(c, st.off);
    for (const o of st.obs) if (o.k === "puddle") drawPuddle(c, o, t);
    drawPig(c);
    for (const o of st.obs) {
      if (o.k === "viper") drawViper(c, o.x, o.y, o.s, t, true);
      else if (o.k === "dropper") drawViper(c, o.x, o.y, o.s, t, true);
      else if (o.k === "orb") drawOrb(c, o, t);
    }
    for (const p of st.parts) { c.globalAlpha = clamp(p.life * 3, 0, 1); c.fillStyle = p.col; c.fillRect(p.x - 2, p.y - 2, 4, 4); }
    c.globalAlpha = 1;
    if (st.flash > 0) { c.fillStyle = `rgba(255,120,60,${st.flash * .35})`; c.fillRect(0, 0, W, H); }
    c.restore();
    drawHud(c);
    drawOver(c);
  }

  let last = 0, acc = 0;
  const STEP = 1 / 120;
  function tick(now) {
    acc += Math.min(.05, (now - last) / 1000 || 0); last = now;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(tick);
  }

  /* ───────── Управление ───────── */
  const JUMP_KEYS = new Set(["Space", "ArrowUp", "KeyW"]), DUCK_KEYS = new Set(["ArrowDown", "KeyS"]);
  const typing = e => e.target.closest && e.target.closest("button") && e.code === "Space";
  addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === "KeyM") { toggleSound(); return; }
    if (typing(e)) return;
    if (JUMP_KEYS.has(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
    else if (DUCK_KEYS.has(e.code)) { e.preventDefault(); setDuck(true); }
  });
  addEventListener("keyup", e => {
    if (typing(e)) return;
    if (JUMP_KEYS.has(e.code)) release();
    else if (DUCK_KEYS.has(e.code)) setDuck(false);
  });
  cv.addEventListener("pointerdown", e => { e.preventDefault(); cv.focus({ preventScroll: true }); press(); });
  addEventListener("pointerup", release);
  addEventListener("pointercancel", release);
  function bindPad(el, down, up) {
    el.addEventListener("pointerdown", e => { e.preventDefault(); down(); });
    for (const n of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(n, up);
    el.addEventListener("contextmenu", e => e.preventDefault());
  }
  bindPad($("#padJump"), press, release);
  bindPad($("#padDuck"), () => setDuck(true), () => setDuck(false));
  cv.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("visibilitychange", () => { if (document.hidden && st.mode === "run") { st.mode = "paused"; st.duckHeld = false; st.held = false; } });
  addEventListener("blur", () => { if (st.mode === "run") { st.mode = "paused"; st.duckHeld = false; st.held = false; } });

  const muteBtn = $("#mute");
  function paintMute() { muteBtn.textContent = soundOn ? "Звук: вкл" : "Звук: выкл"; muteBtn.setAttribute("aria-pressed", String(!soundOn)); }
  function toggleSound() { soundOn = !soundOn; store.set("pigSound", soundOn ? "1" : "0"); paintMute(); }
  muteBtn.addEventListener("click", () => { toggleSound(); muteBtn.blur(); });
  paintMute();

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
